<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japhe Farm">
<title>Japhe Farm: Onion Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#0d1512;
    --bg-surface:#141f19;
    --bg-elevated:#1c2b22;
    --text-primary:#eef2ea;
    --text-secondary:#93a99c;
    --text-muted:#5c7266;
    --accent:#4fae68;
    --accent-dark:#173325;
    --accent-sage:#7a9c85;
    --accent-dim:rgba(79,174,104,0.16);
    --status-success:#4fae68;
    --status-warning:#e0a83f;
    --status-danger:#d1603f;
    --border-subtle:#22302a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg-primary);color:var(--text-primary);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;}
  #root{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}

  .header{padding:20px 20px 4px;}
  .header .farmrow{display:flex; align-items:center; justify-content:space-between;}
  .header .farmname{font-size:17px; font-weight:700;}
  .header .date{font-size:12px; color:var(--text-secondary); margin-top:2px;}
  .badge{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
    background:var(--accent-dim);color:var(--accent);
    padding:4px 9px;border-radius:20px;
  }

  .home-wrap{ height:calc(100dvh - 76px); display:flex; flex-direction:column; overflow:hidden; }
  .home-body{ flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto; padding-bottom:calc(4px + env(safe-area-inset-bottom)); }

  .hero{
    margin:10px 16px 0; background:var(--accent-dark); border-radius:22px;
    padding:20px 20px; position:relative; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; gap:16px; border:1px solid var(--border-subtle);
  }
  .hero::before{content:""; position:absolute; right:-30px; top:-30px; width:150px; height:150px; border-radius:50%; border:22px solid rgba(255,255,255,0.04);}
  .hero::after{content:""; position:absolute; right:18px; bottom:-40px; width:90px; height:90px; border-radius:50%; border:16px solid rgba(255,255,255,0.04);}
  .hero-ring-wrap{position:relative; width:78px; height:78px; flex-shrink:0;}
  .hero-num{font-size:36px; font-weight:800; color:#fff; line-height:1;}
  .hero-label{font-size:11px; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px;}
  .hero-sub{font-size:13.5px; color:rgba(255,255,255,0.8); margin-top:7px;}

  .section-label.tight{ margin:12px 0 7px; flex-shrink:0; }
  .card-list.tight{ flex:1; min-height:0; display:flex; flex-direction:column; gap:7px; overflow-y:auto; }
  .card-list.tight > .card-btn{ flex:0 0 auto; max-height:64px; }
  .card-btn{ box-sizing:border-box; display:block; width:100%; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .card-btn .event-card{ height:100%; box-sizing:border-box; }
  .card-list.tight .event-card{ padding:9px 14px; }
  .card-list.tight .ring-wrap{ width:36px; height:36px; }
  .card-list.tight .ring-num{ font-size:12px; }
  .card-list.tight .ev-name{ font-size:13px; }
  .card-list.tight .ev-sub{ font-size:11px; }
  .card-list.tight.one{ flex:0 0 auto; }
  .card-list.tight.one > .card-btn{ flex:0 0 auto; max-height:64px; }
  .card-list.tight.one .ring-wrap{ width:40px; height:40px; }

  .advisory-card{
    box-sizing:border-box; display:flex; align-items:center; gap:10px; cursor:pointer;
    margin:12px 16px 0; padding:12px 14px; border-radius:14px; -webkit-tap-highlight-color:transparent;
    background:rgba(143,224,164,0.14); border:1px solid rgba(143,224,164,0.35);
  }
  .advisory-card.partial{ background:rgba(240,198,117,0.14); border-color:rgba(240,198,117,0.35); }
  .advisory-card.threat-medium{ background:rgba(240,198,117,0.14); border-color:rgba(240,198,117,0.35); }
  .advisory-card.threat-high{ background:rgba(240,161,127,0.16); border-color:rgba(240,161,127,0.4); }
  .advisory-card.threat-critical{ background:rgba(224,110,110,0.18); border-color:rgba(224,110,110,0.5); }
  .advisory-card .advisory-title{ font-size:13.5px; font-weight:700; color:var(--text-primary); }
  .advisory-card .advisory-sub{ font-size:11.5px; color:var(--text-secondary); margin-top:2px; }
  .advisory-card .chev{ color:var(--text-muted); font-size:16px; margin-left:auto; }

  .hero-text{ min-width:0; flex:1; }

  .empty-state.compact{ margin:10px 20px 0; padding:14px 16px; font-size:12.5px; flex-shrink:0; }

  .section-label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--text-muted); padding:0 20px; margin:22px 0 10px;
    display:flex; align-items:center; justify-content:space-between;
  }

  .card-list{padding:0 16px; display:flex; flex-direction:column; gap:10px;}
  .event-card{
    background:var(--bg-surface); border:1px solid var(--border-subtle);
    border-radius:16px; padding:14px 16px;
    display:flex; align-items:center; gap:14px;
  }
  .ring-wrap{position:relative; width:52px; height:52px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;}
  .ring-num.neutral{ color:var(--accent-sage); }
  .event-card .ev-mid{min-width:0; flex:1;}
  .event-card .ev-name{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .event-card .ev-sub{font-size:12px; color:var(--text-secondary); margin-top:2px;}
  .event-card .ev-obs{font-size:11.5px; color:var(--text-muted); margin-top:3px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ok{color:var(--status-success);}
  .warn{color:var(--status-warning);}
  .danger{color:var(--status-danger);}

  .timeline{padding:6px 20px 0; display:flex; gap:0; overflow-x:auto; -webkit-overflow-scrolling:touch; flex-shrink:0;}
  .timeline::-webkit-scrollbar{display:none;}

  .empty-state{margin:20px 20px 0; text-align:center; color:var(--text-secondary); font-size:13.5px; line-height:1.6; background:var(--bg-surface); border:1px dashed var(--border-subtle); border-radius:16px; padding:24px 16px;}

  .timeline-vertical{ margin:0 16px; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:16px; padding:16px; }
  .tlv-item{ display:flex; gap:12px; }
  .tlv-marker{ display:flex; flex-direction:column; align-items:center; }
  .tlv-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent-sage); flex-shrink:0; margin-top:4px; }
  .tlv-line{ width:1px; flex:1; background:var(--border-subtle); margin-top:4px; min-height:22px; }
  .tlv-content{ padding-bottom:16px; min-width:0; }
  .tlv-name{ font-size:13.5px; font-weight:700; }
  .tlv-date{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(20,31,25,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--border-subtle);
    display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav-inner{max-width:480px; width:100%; display:flex;}
  .nav-btn{flex:1; background:none; border:none; padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-muted); font-size:11px; font-weight:600;}
  .nav-btn.active{color:var(--accent);}

  .settings-block{margin:0 20px 24px; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:16px; padding:16px;}
  .settings-block h3{margin:0 0 12px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-secondary);}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block; font-size:12px; color:var(--text-secondary); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg-elevated); border:1px solid var(--border-subtle);
    border-radius:10px; padding:11px 12px; color:var(--text-primary); font-size:15px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
  .field select:disabled{color:var(--text-muted);}
  .hint{font-size:11px; color:var(--text-muted); margin-top:6px;}

  .why-block{ background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:16px; padding:16px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .why-title{ font-size:15px; font-weight:700; color:var(--text-primary); margin-bottom:8px; }
  .why-status-row{ margin-bottom:6px; }
  .why-status-badge{ display:inline-block; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .why-status-badge.full{ background:rgba(143,224,164,0.18); color:#8fe0a4; }
  .why-status-badge.partial{ background:rgba(240,198,117,0.18); color:#f0c675; }
  .why-status-badge.none{ background:rgba(240,161,127,0.18); color:#f0a17f; }
  .why-status-badge.no-data{ background:rgba(255,255,255,0.1); color:var(--text-muted); }
  .why-status-badge.on-pace{ background:rgba(159,199,224,0.18); color:#9fc7e0; }
  .why-subhead{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin:0; }
  .why-criteria-list{ display:flex; flex-direction:column; gap:12px; }
  .why-criterion{ display:flex; flex-direction:column; gap:2px; font-size:12.5px; }
  .why-crit-field{ font-weight:600; color:var(--text-primary); margin-bottom:2px; }
  .why-crit-expected{ color:var(--text-secondary); }
  .why-crit-observed{ color:var(--text-muted); }

  .why-card-head{ box-sizing:border-box; display:flex; align-items:flex-start; justify-content:space-between; width:100%; cursor:pointer; -webkit-tap-highlight-color:transparent; gap:10px; }
  .why-collapsible-chev{ font-size:15px; font-weight:700; color:var(--text-muted); width:18px; text-align:center; flex-shrink:0; }
  .why-block.threat-medium{ border-color:rgba(240,198,117,0.4); }
  .why-block.threat-high{ border-color:rgba(240,161,127,0.45); }
  .why-block.threat-critical{ border-color:rgba(224,110,110,0.55); background:rgba(224,110,110,0.06); }
  .why-block.guardrail-medium{ border-color:rgba(240,198,117,0.35); }
  .why-block.guardrail-low{ border-color:var(--border-subtle); }
  .why-block.guardrail-high{ border-color:rgba(240,161,127,0.45); }
  .why-block.guardrail-critical{ border-color:rgba(224,110,110,0.55); background:rgba(224,110,110,0.06); }

  .why-source-links{ display:flex; flex-direction:column; gap:6px; }
  .why-source-link{ font-size:11.5px; color:var(--accent); text-decoration:none; word-break:break-word; }

  .backup-text{
    width:100%; min-height:180px; background:var(--bg-elevated); border:1px solid var(--border-subtle);
    border-radius:10px; padding:12px; color:var(--text-primary); font-size:12px; line-height:1.5;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace; resize:vertical;
  }
  .backup-text:focus{outline:none; border-color:var(--accent);}

  .data-row{
    width:100%; background:none; border:none; border-bottom:1px solid var(--border-subtle);
    padding:14px 2px; display:flex; align-items:center; justify-content:space-between;
    font-size:14.5px; font-weight:600; color:var(--text-primary); text-align:left;
  }
  .data-row:last-child{border-bottom:none;}
  .data-row .chev{color:var(--text-muted); font-size:18px;}

  .obs{font-size:12.5px; color:var(--text-secondary); font-style:italic; line-height:1.4;}

  .add-btn{width:100%; background:var(--accent-dim); color:var(--accent); border:1px dashed var(--accent); border-radius:10px; padding:12px; font-size:14px; font-weight:700; margin-top:14px;}
  .shape-select{display:flex; gap:8px; margin-bottom:16px;}
  .shape-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; border-radius:10px; border:1px solid var(--border-subtle); background:var(--bg-elevated); color:var(--text-secondary);}
  .shape-btn.active{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}
  .shape-btn-label{font-size:11px; font-weight:700; text-align:center;}
  .suggest-btn{width:100%; background:var(--bg-elevated); color:var(--accent); border:1px solid var(--accent); border-radius:10px; padding:11px; font-size:13px; font-weight:700; margin-bottom:14px; text-align:left;}
  .suggest-btn .suggest-sub{display:block; font-weight:500; color:var(--text-secondary); font-size:11px; margin-top:2px;}
  .bed-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-subtle);}
  .bed-row:last-child{border-bottom:none;}
  .bed-row .bed-remove{color:var(--status-danger); font-size:13px; font-weight:700; padding:4px 8px; background:none; border:none;}
  .calc-total{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--bg-elevated); border-radius:10px; margin:12px 0; font-size:14px; font-weight:700;}
  .calc-result{background:var(--accent-dim); border:1px solid var(--accent); border-radius:12px; padding:14px; margin-top:16px;}
  .calc-result-row{display:flex; justify-content:space-between; font-size:14px; padding:4px 0; color:var(--text-secondary);}
  .calc-result-row.total{font-weight:800; font-size:16px; color:var(--text-primary); border-top:1px solid var(--border-subtle); margin-top:6px; padding-top:10px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--bg-surface); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto; border:1px solid var(--border-subtle); border-bottom:none;}
  .modal h2{margin:0 0 16px; font-size:17px; font-weight:800;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; border-radius:10px; padding:13px; font-size:15px; font-weight:700; border:none;}
  .btn-primary{background:var(--accent); color:#0d1512;}
  .btn-secondary{background:var(--bg-elevated); color:var(--text-secondary); border:1px solid var(--border-subtle);}
</style>
</head>

<script type="module">
  // Firebase Realtime Database — used only for the optional "Shared Farm" feature (Settings).
  // The app works standalone on localStorage with no Firebase involvement at all if the user
  // never sets up a shared farm. This config is safe to be public in client-side code; real
  // access control comes from the Realtime Database security rules, not from hiding this.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCB4J_OC_JR7XsleLkU638Oe0J-Xw7A8BI",
    authDomain: "japhe-farm.firebaseapp.com",
    databaseURL: "https://japhe-farm-default-rtdb.firebaseio.com",
    projectId: "japhe-farm",
    storageBucket: "japhe-farm.firebasestorage.app",
    messagingSenderId: "555314709584",
    appId: "1:555314709584:web:86b440e7cf850c9b45fd55"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window.__fb = { ref, onValue, set, get, db };
  window.dispatchEvent(new Event("firebase-ready"));
</script>
<script>
const e = React.createElement;
const useState = React.useState;
const useEffect = React.useEffect;
const useMemo = React.useMemo;
const useRef = React.useRef;

const STORAGE_KEY = "japhe_farm_v1";
const LANG_KEY = "japhe_farm_lang";
const SYNC_KEY = "japhe_farm_sync_v1";

// --- Shared farm sync (optional feature) ----------------------------------------------------
// Kept entirely separate from the main data blob (STORAGE_KEY) and its migration logic, so a
// user who never touches "Shared Farm" in Settings is completely unaffected by any of this.
// Design: whole-state, last-write-wins sync via one Realtime Database path per farm code.
// `updatedAt` is a plain client timestamp (not serverTimestamp()) so it can be compared
// synchronously the moment new data arrives — acceptable at this app's scale (a couple of
// people logging a few events a day), where exact clock sync isn't worth the complexity of a
// server-resolved timestamp. `needsSync` is the durable "this device has edits Firebase
// doesn't have yet" flag: it lives in localStorage (not memory) specifically so it survives
// the app being fully closed while offline — Realtime Database's own offline write queue only
// lasts for the current page session, which isn't enough for a farm with patchy signal where
// the app may be closed and reopened many times before reconnecting.
function loadSyncMeta(){
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    if(!raw) return { farmCode:null, updatedAt:0, needsSync:false };
    const parsed = JSON.parse(raw);
    return { farmCode: parsed.farmCode || null, updatedAt: parsed.updatedAt || 0, needsSync: !!parsed.needsSync };
  }catch(err){ return { farmCode:null, updatedAt:0, needsSync:false }; }
}
function saveSyncMeta(meta){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(meta)); }catch(err){} }

// A short, easy-to-read-aloud code — avoids visually ambiguous characters (0/O, 1/I/L) since
// this is meant to be shared with a family member over a phone call, not copy-pasted.
const FARM_CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function generateFarmCode(){
  let code = "";
  for(let i = 0; i < 6; i++){ code += FARM_CODE_CHARS[Math.floor(Math.random() * FARM_CODE_CHARS.length)]; }
  return code;
}

// Resolves once the Firebase module script (loaded separately, see <head>) has finished
// initializing. Needed because that script is type="module" (deferred) while this one is a
// classic script, so window.__fb may not exist yet the first time this file runs.
function getFirebase(){
  return new Promise(function(resolve){
    if(window.__fb) return resolve(window.__fb);
    window.addEventListener("firebase-ready", function(){ resolve(window.__fb); }, { once:true });
  });
}

// Checks the shared farm's current updatedAt before writing, so a device pushing slightly
// stale data (e.g. right after reconnecting, before its own subscription has caught up) can
// never clobber a genuinely newer edit from the other device. If remote is already newer, this
// deliberately does nothing — the caller's own onValue subscription will pick up that newer
// remote version on its own moments later.
function fbPushState(farmCode, state, updatedAt){
  return getFirebase().then(function(fb){
    const path = fb.ref(fb.db, "farms/" + farmCode);
    return fb.get(path).then(function(snap){
      const existing = snap.val();
      if(existing && existing.updatedAt && existing.updatedAt > updatedAt) return { skipped:true };
      return fb.set(path, {
        farm: state.farm, events: state.events, observations: state.observations || [],
        areaBeds: state.areaBeds || [], updatedAt: updatedAt
      }).then(function(){ return { skipped:false }; });
    });
  });
}
function fbFetchState(farmCode){
  return getFirebase().then(function(fb){
    return fb.get(fb.ref(fb.db, "farms/" + farmCode)).then(function(snap){ return snap.val(); });
  });
}
// onData is called every time the shared farm's data changes, including immediately with
// whatever's already there — this is how the OTHER device's edits arrive on this one. Returns
// an unsubscribe function.
function fbSubscribe(farmCode, onData){
  let unsub = null, cancelled = false;
  getFirebase().then(function(fb){
    if(cancelled) return;
    unsub = fb.onValue(fb.ref(fb.db, "farms/" + farmCode), function(snap){ onData(snap.val()); });
  });
  return function(){ cancelled = true; if(unsub) unsub(); };
}
// Firebase's own connectivity signal (true only when actually connected to the database, not
// just "the phone thinks it has signal") — the trigger for retrying any queued offline sync.
// Returns an unsubscribe function.
function fbSubscribeConnectivity(onChange){
  let unsub = null, cancelled = false;
  getFirebase().then(function(fb){
    if(cancelled) return;
    unsub = fb.onValue(fb.ref(fb.db, ".info/connected"), function(snap){ onChange(!!snap.val()); });
  });
  return function(){ cancelled = true; if(unsub) unsub(); };
}

function daysSince(dateStr){
  if(!dateStr) return 0;
  const start = new Date(dateStr + "T00:00:00");
  if(isNaN(start.getTime())) return 0;
  const now = new Date();
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((nowMid - startMid) / 86400000);
}
// Pure date-diff between two logged dates (positive when b is after a) — used by Guardrails,
// which check the relationship between two of the farmer's own logged dates, not "now."
function daysBetween(dateA, dateB){
  if(!dateA || !dateB) return null;
  const a = new Date(dateA + "T00:00:00"), b = new Date(dateB + "T00:00:00");
  if(isNaN(a.getTime()) || isNaN(b.getTime())) return null;
  return Math.round((b - a) / 86400000);
}

// Area Calculator — shape math. Acute triangle takes all 3 side lengths (easiest to measure in
// the field with a tape/rope) and uses Heron's formula rather than requiring an angle.
const BED_SHAPES = [
  { id:"rectangle", label:"Rectangle" },
  { id:"trapezoid", label:"Trapezoid" },
  { id:"right_triangle", label:"Right triangle" },
  { id:"acute_triangle", label:"Acute triangle" }
];
function shapeIconSvg(shapeId){
  const common = { viewBox:"0 0 24 24", width:"28", height:"28", fill:"none", stroke:"currentColor", strokeWidth:"2", strokeLinejoin:"round", strokeLinecap:"round" };
  if(shapeId === "rectangle") return e("svg", common, e("rect", { x:"3", y:"6", width:"18", height:"12" }));
  if(shapeId === "trapezoid") return e("svg", common, e("path", { d:"M5,6 L19,6 L21,18 L3,18 Z" }));
  if(shapeId === "right_triangle") return e("svg", common, e("path", { d:"M4,20 L4,4 L20,20 Z" }));
  if(shapeId === "acute_triangle") return e("svg", common, e("path", { d:"M12,3 L21,19 L3,17 Z" }));
  return null;
}
function computeShapeArea(shape, dims){
  if(shape === "rectangle"){
    const l = Number(dims.length), w = Number(dims.width);
    if(!(l > 0) || !(w > 0)) return null;
    return l * w;
  }
  if(shape === "trapezoid"){
    const l = Number(dims.length), w1 = Number(dims.width1), w2 = Number(dims.width2);
    if(!(l > 0) || !(w1 > 0) || !(w2 > 0)) return null;
    return ((w1 + w2) / 2) * l;
  }
  if(shape === "right_triangle"){
    const b = Number(dims.base), h = Number(dims.height);
    if(!(b > 0) || !(h > 0)) return null;
    return 0.5 * b * h;
  }
  if(shape === "acute_triangle"){
    const a = Number(dims.sideA), b = Number(dims.sideB), c = Number(dims.sideC);
    if(!(a > 0) || !(b > 0) || !(c > 0)) return null;
    // Triangle inequality check — three sides that can't form a real triangle.
    if(a + b <= c || a + c <= b || b + c <= a) return null;
    const s = (a + b + c) / 2;
    const inner = s * (s - a) * (s - b) * (s - c);
    if(inner <= 0) return null;
    return Math.sqrt(inner);
  }
  return null;
}

function withOrdinals(events){
  const byCat = {};
  const sorted = events.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  const ordinalById = {};
  sorted.forEach(function(ev){
    byCat[ev.categoryId] = (byCat[ev.categoryId] || 0) + 1;
    ordinalById[ev.id] = byCat[ev.categoryId];
  });

}

// A transplanting event may span several days rather than happening in one day (see
// transplantAnchorDate below for why this matters to the engine). When it does, ev.date is the
// start and ev.endDate is the completion date; this renders that as a range instead of implying
// a single-day event.
function transplantSpanDays(ev){
  if(!ev || ev.categoryId !== "transplanting" || !ev.endDate || ev.endDate <= ev.date) return null;
  const gap = daysBetween(ev.date, ev.endDate);
  return gap == null ? null : gap + 1;
}
// The date the engine treats as "transplanting happened" for age (DAT) calculations. Per the
// simple-mode design decision, that's the completion date when transplanting spanned multiple
// days (never an averaged date — see transplantDatRange for why averaging is avoided), and the
// single logged date otherwise.
function transplantAnchorDate(ev){
  if(!ev) return null;
  return (ev.categoryId === "transplanting" && ev.endDate && ev.endDate > ev.date) ? ev.endDate : ev.date;
}
// For a multi-day transplanting event, the true crop age varies by how early or late a given
// section was planted. Rather than collapsing that into one averaged age (which mistimes
// fertilizer/irrigation/pest guidance for every section except the middle one), this exposes the
// real earliest/latest/average DAT so a screen can show the range instead of a false single number.
function transplantDatRange(ev){
  const span = transplantSpanDays(ev);
  if(!span) return null;
  // The earliest-transplanted section (start date) is the OLDEST and so has the highest DAT;
  // the last-transplanted section (end date) is the YOUNGEST and has the lowest DAT.
  const oldestSectionDAT = daysSince(ev.date);
  const youngestSectionDAT = daysSince(ev.endDate);
  return {
    spanDays: span,
    minDAT: youngestSectionDAT, maxDAT: oldestSectionDAT,
    averageDAT: Math.round((oldestSectionDAT + youngestSectionDAT) / 2)
  };
}
function eventDisplayName(ev){
  const cat = categoryMeta(ev.categoryId);
  if(ev.categoryId === "transplanting" && transplantSpanDays(ev)){
    return t("ev.transplantCompletedOver") + " " + transplantSpanDays(ev) + " " + t("ev.days") + " (" + formatDateDisplay(ev.date) + "\u2013" + formatDateDisplay(ev.endDate) + ")";
  }
  if(ev.categoryId === "spray") return t("ev.spraying") + " (" + optionLabel(ev.sprayType || "Insecticide") + ")";
  if(ev.categoryId === "fertilizer" && ev.fertilizerType) return t("ev.fertilizerApplication") + " (" + optionLabel(ev.fertilizerType) + (ev.quantityKg ? ", " + ev.quantityKg + "kg" : "") + ")";
  if(ev.categoryId === "stored_sold"){
    const outcome = ev.outcome || "Stored";
    let text = optionLabel(outcome);
    if(ev.quantityGunia) text += " (" + ev.quantityGunia + " gunia)";
    if(outcome === "Sold" && ev.priceTsh) text += ", Tsh " + Number(ev.priceTsh).toLocaleString();
    return text;
  }
  if(ev.label) return ev.label;
  return categoryLabel(cat.id);
}

function RingGauge(props){
  const days = props.days, size = props.size || 52, stroke = props.stroke || 5, neutral = props.neutral;
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, days / 30));
  const color = neutral ? "var(--accent-sage)" : urgencyColorVar(days);
  const numClass = neutral ? "neutral" : urgencyClass(days);
  return e("div", { className:"ring-wrap", style:{ width:size, height:size } },
    e("svg", { width:size, height:size },
      e("circle", { cx:size/2, cy:size/2, r:r, fill:"none", stroke:"var(--bg-elevated)", strokeWidth:stroke }),
      e("circle", { cx:size/2, cy:size/2, r:r, fill:"none", stroke:color, strokeWidth:stroke, strokeDasharray:c, strokeDashoffset:c*(1-pct), strokeLinecap:"round" })
    ),
    e("div", { className:"ring-num mono " + numClass }, days < 0 ? "—" : days)
  );
}

function TopAttentionCard(props){

// --- Nursery pace engine (germination phase only) ------------------------------------------
// Interpolates a simple straight-line estimate between two already-sourced points: sowing
// (0 leaves, day 0) and the ready-to-transplant checkpoint from BASELINE_CHECKS.readyToTransplant
// (3-5 leaves at 6-8 weeks, source G7). This is NOT a continuous researched growth curve — it's
// an honest interpolation between two verified facts, and the UI labels it as an estimate.
// Compares the farmer's own logged leaf-count trend against this line to say ahead/on pace/behind,
// and predicts days remaining to the transplant-ready leaf target.
const PACE_TARGET_LEAVES = 4;   // midpoint — used for projection when NOT yet in the ready window
const PACE_TARGET_DAYS  = 49;   // midpoint of the sourced 6-8 week (42-56 day) range
const PACE_MIN_LEAVES = 3;      // lower bound of the sourced 3-5 leaf range — same threshold the
                                 // existing readyToTransplant baseline check already uses, so this
                                 // card can never contradict that one. Deliberately no day-count
                                 // gate: the baseline check doesn't use one either, it checks leaf
                                 // count and height independently.

function evaluateNurseryPace(sowingEvent, observations){
  if(!sowingEvent) return null;
  const seasonObs = (observations || []).filter(function(o){
    return o.date >= sowingEvent.date && o.leafCount != null && o.leafCount !== "";
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });

  if(seasonObs.length < 2){
    return { status: "insufficient", observationCount: seasonObs.length };
  }

  const first  = seasonObs[0];
  const latest = seasonObs[seasonObs.length - 1];
  const daysElapsed = daysBetween(first.date, latest.date);
  const leavesGained = latest.leafCount - first.leafCount;
  if(daysElapsed <= 0 || leavesGained < 0) return null;

  const actualRate   = leavesGained / daysElapsed;                 // leaves/day, full-season trend
  const expectedRate = PACE_TARGET_LEAVES / PACE_TARGET_DAYS;      // ~0.082 leaves/day

  // Recent trend (last two observations) drives the days-to-target prediction, so it responds
  // to a recent slowdown/speedup rather than being dragged by the whole season's average.
  let recentRate = actualRate;
  const lastTwo = seasonObs.slice(-2);
  const dRecent = daysBetween(lastTwo[0].date, lastTwo[1].date);
  const lRecent = lastTwo[1].leafCount - lastTwo[0].leafCount;
  if(dRecent > 0 && lRecent >= 0) recentRate = lRecent / dRecent;

  const ratio = actualRate / expectedRate;
  // Status and badge are computed separately: badge conveys severity (matches the rest of the
  // Why screen's full/partial/none/no-data language), status conveys the plain-language state
  // used in Home's one-line hint. "On pace" gets its own neutral badge color rather than
  // reusing "no-data" grey, which everywhere else in this app means "nothing recorded yet."
  let status, badgeClass;
  if(ratio >= 1.15){ status = "ahead"; badgeClass = "full"; }
  else if(ratio <= 0.6){ status = "behind"; badgeClass = "none"; }
  else if(ratio <= 0.85){ status = "behind"; badgeClass = "partial"; }
  else { status = "onPace"; badgeClass = "on-pace"; }

  // Once the farmer has already reached the guideline's own minimum (3 leaves), stop projecting
  // toward the arbitrary midpoint (4 leaves) — the guideline is a range, not a single target, and
  // chasing the midpoint past the point of already being "ready" is misleading.
  const inTransplantWindow = latest.leafCount >= PACE_MIN_LEAVES;

  // Predict days until the target leaf count (only meaningful if still growing, not yet in the
  // ready window, and not there yet)
  let daysToTarget = null;
  if(!inTransplantWindow && recentRate > 0 && latest.leafCount < PACE_TARGET_LEAVES){
    daysToTarget = Math.max(0, Math.ceil((PACE_TARGET_LEAVES - latest.leafCount) / recentRate));
  }

  return {
    status: status,
    badgeClass: badgeClass,
    inTransplantWindow: inTransplantWindow,
    actualRate: actualRate,
    expectedRate: expectedRate,
    recentRate: recentRate,
    latestLeafCount: latest.leafCount,
    daysToTarget: daysToTarget,
    observationCount: seasonObs.length
  };
}
// Picks the one check relevant to the current phase/sub-stage, evaluates it against the most
// recent Observation, and returns everything the "Why" screen needs to explain itself. Never
// changes the logged-event phase — advisory only, per design decision.
function evaluateBaselineCheck(heroPhase, subStageLabel, observations, seasonAnchorDate){
  let checkKey = null;
  Object.keys(BASELINE_CHECKS).forEach(function(key){
    const c = BASELINE_CHECKS[key];
    if(c.appliesWhenPhase !== heroPhase) return;
    if(c.onlySubStage){
      const allowed = Array.isArray(c.onlySubStage) ? c.onlySubStage : [c.onlySubStage];
      if(allowed.indexOf(subStageLabel) === -1) return;
    }
    checkKey = key;
  });
  if(!checkKey) return null;
  const check = BASELINE_CHECKS[checkKey];
  const swCheck = currentLang === "sw" ? BASELINE_CHECKS_SW[checkKey] : null;

  // Only consider observations logged this season — otherwise a leftover observation from a
  // previous (or pre-season) cycle can be picked up as "the latest" and used to justify advice
  // about the current season.
  const inSeason = function(o){ return !seasonAnchorDate || o.date >= seasonAnchorDate; };
  const seasonObservations = (observations || []).filter(inSeason);
  const latest = seasonObservations.slice().sort(function(a,b){ return b.date.localeCompare(a.date); })[0] || null;

  const results = check.criteria.map(function(c){
    const outcome = latest ? c.test(latest) : null; // true=match, false=not yet, null=not recorded
    const observedValue = latest ? c.getValue(latest) : null;
    const swCriterion = swCheck ? swCheck.criteria[c.key] : null;
    return {
      fieldLabel: swCriterion ? swCriterion.fieldLabel : c.fieldLabel,
      expectedText: swCriterion ? swCriterion.expectedText : c.expectedText,
      outcome: outcome,
      observedValue: currentLang === "sw" && observedValue != null ? optionLabel(observedValue) : observedValue
    };
  });
  const provided = results.filter(function(r){ return r.outcome !== null; });
  let overall;
  if(!latest || provided.length === 0) overall = "no-data";
  else if(provided.length === results.length && provided.every(function(r){ return r.outcome === true; })) overall = "full";
  else if(provided.some(function(r){ return r.outcome === true; })) overall = "partial";
  else overall = "none";

  return {
    checkKey: checkKey, label: swCheck ? swCheck.label : check.label, actionHint: swCheck ? swCheck.actionHint : check.actionHint,
    sourceKeys: check.sourceKeys, sourceNote: swCheck ? swCheck.sourceNote : check.sourceNote,
    results: results, overall: overall,
    observationDate: latest ? latest.date : null
  };
}

// ---- One-time phase actions ----
// Some recommendations aren't "do this repeatedly, more urgent the longer you wait" (that's
// what FULL_PRIORITY / ACTION_GUIDANCE are for) — they're "do this exactly once, triggered by
// a real event you log, and once done never show it again as an action, only in History."
// Nursery mulch removal is the first case: it's paced by the farmer's own logged emergence
// date (never a fixed calendar day, onions germinate anywhere from ~7 to 14+ days), and once
// removed it's permanently finished for the season.
const ONE_TIME_ACTIONS = {
  removeNurseryMulch: {
    appliesWhenPhase: "germination",
    triggerCategory: "emergence",
    doneCategory: "mulch",
    label: "Remove nursery mulch",
    guidance: "Remove the mulch or cover as soon as seedlings actually sprout, not on a fixed day count. Multiple regional sources agree on this trigger regardless of how long germination itself took.",
    avoid: "Don't leave it on once seedlings have emerged; it blocks light and can weaken or scorch the shoots. Don't remove it before germination either, uncovered soil exposes the seed bed to birds, drying out, and temperature swings before the seedlings are actually up.",
    sourceKeys: ["KE2", "UG3"]
  }
};

// Swahili translation of ONE_TIME_ACTIONS, keyed the same way — same pattern as THREAT_RULES_SW.
const ONE_TIME_ACTIONS_SW = {
  removeNurseryMulch: {
    label: "Ondoa matandazo ya kitalu",
    guidance: "Ondoa matandazo au kifuniko mara tu miche inapoota kweli, si kwa idadi maalum ya siku. Vyanzo vingi vya kanda hii vinakubaliana na kigezo hiki bila kujali muda uliochukua kuota.",
    avoid: "Usiache matandazo baada ya miche kuota; yanazuia mwanga na yanaweza kudhoofisha au kuchoma miche. Pia usiondoe kabla ya kuota, udongo ulio wazi unaweka mbegu hatarini kwa ndege, ukavu, na mabadiliko ya joto kabla miche haijaota kikamilifu."
  }
};
// Evaluates one specific one-time action against the farmer's own logged events (never a
// calendar assumption). Returns null if it doesn't apply to the current phase at all.
function evaluateOneTimeAction(actionKey, heroPhase, events, seasonAnchorDate){
  const action = ONE_TIME_ACTIONS[actionKey];
  if(!action || action.appliesWhenPhase !== heroPhase) return null;
  const sw = currentLang === "sw" ? ONE_TIME_ACTIONS_SW[actionKey] : null;
  const displayAction = sw ? Object.assign({}, action, sw) : action;
  const inSeason = function(ev){ return !seasonAnchorDate || ev.date >= seasonAnchorDate; };
  const triggers = events.filter(function(ev){ return ev.categoryId === action.triggerCategory && inSeason(ev); });
  if(triggers.length === 0) return { key: actionKey, action: displayAction, status: "not-yet-triggered", triggerEvent: null, doneEvent: null };
  const triggerEvent = triggers.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).pop();
  // Use the season anchor (not the exact trigger date) as the cutoff: the real question is
  // "did this done-action happen this season?", not "did it happen after this specific trigger
  // log entry?". Otherwise a done-event logged slightly before the trigger event (e.g. mulch
  // removed the day before emergence was logged), or before a later duplicate trigger event
  // (e.g. a second emergence log), is wrongly rejected.
  const doneSince = seasonAnchorDate || triggerEvent.date;
  const doneMatches = events.filter(function(ev){ return ev.categoryId === action.doneCategory && ev.date >= doneSince; });
  const doneEvent = doneMatches.length ? doneMatches.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).pop() : null;
  return { key: actionKey, action: displayAction, status: doneEvent ? "done" : "due", triggerEvent: triggerEvent, doneEvent: doneEvent };
}

function evaluateSunlightAction(actionKey, heroPhase, observations, seasonAnchorDate){
  const action = SUNLIGHT_ACTIONS[actionKey];
  if(!action || action.appliesWhenPhase !== heroPhase) return null;
  const sw = currentLang === "sw" ? SUNLIGHT_ACTIONS_SW[actionKey] : null;
  const displayAction = sw ? Object.assign({}, action, sw) : action;
  const inSeason = function(o){ return !seasonAnchorDate || o.date >= seasonAnchorDate; };
  const withField = (observations || []).filter(function(o){ return o.sunlightEffect && inSeason(o); }).sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(withField.length === 0) return null;
  const latest = withField[withField.length - 1];
  if(actionKey === "erectShade"){
    if(latest.sunlightEffect !== "Mild scorch seen") return null;
    return { key: actionKey, action: displayAction, status: "due", triggerEvent: latest };
  }
  if(actionKey === "removeShadeGradually"){
    // Track this as a small state machine over the whole season's observations, not just the
    // single latest one: find the most recent "Shade erected" reading, then check whether
    // anything at or beyond "Shade partially removed" was logged after it. This still flags the
    // advisory even if the farmer's very next logged observation jumps straight to "fully
    // removed" — previously that skip made the engine forget "erected" ever happened, and also
    // correctly resolves the advisory once it happens, rather than leaving it stuck forever.
    const erectedEvents = withField.filter(function(o){ return o.sunlightEffect === "Shade erected"; });
    if(erectedEvents.length === 0) return null;
    const lastErected = erectedEvents[erectedEvents.length - 1];
    const resolvedAfter = withField.some(function(o){ return o.date > lastErected.date && obsSunlightIndex(o.sunlightEffect) >= obsSunlightIndex("Shade partially removed"); });
    if(resolvedAfter) return null;
    return { key: actionKey, action: displayAction, status: "due", triggerEvent: lastErected };
  }
  return null;
}

// ---- Threat Map (pest/disease diagnosis) ----
// "I see X on my leaves -> it's likely Y." Structured-field only, same discipline as the rest
// of the engine: no free-text parsing. The widened-vocabulary idea is handled here by grouping
// equivalent phrasings under one concept (SYMPTOM_GROUPS) rather than fuzzy-matching many raw
// values — a new equivalent dropdown option can be added to a group later without touching any
// match function. Every rule here was checked against the actual FiBL Africa manual (G7) text,
// not just plausible-sounding agronomy: Stemphylium was dropped entirely (no real source found
// for it in G7 or any African-region source checked), Botrytis was split into the two genuinely
// distinct diseases the source describes (a foliar Leaf Blight vs. the storage-stage Neck Rot,
// which the source states is "often only visible on removal from storage" — not a mid-season
// field symptom), and Downy mildew's match was rewritten to the source's actual described

// Evaluates every threat rule against the most recent in-season observation. Only runs during
// the growing/drying phases, since these are field/harvest-stage diseases, not nursery ones.
function evaluateThreatMap(heroPhase, heroStageLabel, observations, seasonAnchorDate){
  if(heroPhase !== "growing" && heroPhase !== "drying") return [];
  const inSeason = function(o){ return !seasonAnchorDate || o.date >= seasonAnchorDate; };
  const seasonObs = (observations || []).filter(inSeason).sort(function(a,b){ return a.date.localeCompare(b.date); });
  const latest = seasonObs[seasonObs.length - 1];
  if(!latest) return [];
  return THREAT_RULES.filter(function(rule){
    return rule.stages.indexOf(heroStageLabel) !== -1 && rule.match(latest);
  }).map(function(rule){
    const d = threatDisplay(rule);
    return { id: rule.id, label: d.label, severity: rule.severity, message: d.message, avoid: d.avoid, sourceKeys: rule.sourceKeys, observationDate: latest.date };
  });
}

// ---- Guardrails ----
// "You just did X at a time that contradicts the sourced guidance -> a note for next time."
// This is retrospective, educational feedback about an event that already happened, not an
// action still needed — so it's shown on Why as awareness, not as a Home advisory card
// demanding action. Checked against the farmer's own logged dates relative to other logged
// milestones (transplant, harvest), never a free-floating calendar assumption.
const GUARDRAILS = [
  {
    id: "fertilizer_too_late",
    label: "Fertilizer applied later than the recommended window",
    categoryId: "fertilizer",
    severity: "medium",
    check: function(ev, ctx){
      if(!ctx.transplantEvent) return false;
      const dpt = daysBetween(transplantAnchorDate(ctx.transplantEvent), ev.date);
      if(dpt == null || dpt < 0) return false;
      if(ctx.harvestEvent){
        const daysBeforeHarvest = daysBetween(ev.date, ctx.harvestEvent.date);
        if(daysBeforeHarvest != null && daysBeforeHarvest < 28) return true;
      }
      return dpt > 55;
    },
    message: "Guidance is to split fertilizer around 30 and 45 days after transplanting, then stop at least 4 weeks before harvest. This application looks later than that window.",
    avoid: "Late, heavy nitrogen tends to cause thick necks and poor storage rather than more yield at this point in the season.",
    sourceKeys: ["G1", "KE1", "G7"]
  },
  {
    id: "irrigation_too_close_to_harvest",
    label: "Irrigation logged close to harvest",
    categoryId: "irrigation",
    severity: "low",
    check: function(ev, ctx){
      if(!ctx.harvestEvent) return false;
      const daysBeforeHarvest = daysBetween(ev.date, ctx.harvestEvent.date);
      return daysBeforeHarvest != null && daysBeforeHarvest >= 0 && daysBeforeHarvest < 14;
    },
    message: "Guidance is to reduce and stop irrigation 2-4 weeks before harvest. This watering was logged less than 2 weeks before the harvest date.",
    avoid: "Watering too close to harvest can affect curing and storage quality.",
    sourceKeys: ["G1", "G7", "G8", "G9"]
  }
];

// Swahili translations of GUARDRAILS, keyed by rule id — same pattern as THREAT_RULES_SW above.
const GUARDRAILS_SW = {
  fertilizer_too_late: {
    label: "Mbolea iliwekwa baadaye kuliko wakati unaoshauriwa",
    message: "Muongozo unashauri kugawa mbolea karibu siku 30 na 45 baada ya kuhamisha miche, kisha kusimamisha angalau wiki 4 kabla ya kuvuna. Uwekaji huu unaonekana ni baadaye ya muda huo.",
    avoid: "Nitrojeni nyingi wakati wa mwisho huwa inasababisha shingo nene na uhifadhi mbaya badala ya mavuno zaidi katika kipindi hiki cha msimu."
  },
  irrigation_too_close_to_harvest: {
    label: "Kumwagilia kuliwekwa karibu na wakati wa mavuno",
    message: "Muongozo unashauri kupunguza na kusimamisha kumwagilia wiki 2-4 kabla ya kuvuna. Kumwagilia huku kuliwekwa chini ya wiki 2 kabla ya tarehe ya mavuno.",
    avoid: "Kumwagilia karibu sana na mavuno kunaweza kuathiri ukaushaji na ubora wa uhifadhi."
  }
};
function evaluateGuardrails(events, seasonAnchorDate, transplantEvent, harvestEvent){
  const inSeason = function(ev){ return !seasonAnchorDate || ev.date >= seasonAnchorDate; };
  const ctx = { transplantEvent: transplantEvent, harvestEvent: harvestEvent };
  const flags = [];
  GUARDRAILS.forEach(function(rule){
    events.filter(function(ev){ return ev.categoryId === rule.categoryId && inSeason(ev); }).forEach(function(ev){
      if(rule.check(ev, ctx)){
        const sw = currentLang === "sw" ? GUARDRAILS_SW[rule.id] : null;
        flags.push({ id: rule.id, label: sw ? sw.label : rule.label, severity: rule.severity, message: sw ? sw.message : rule.message, avoid: sw ? sw.avoid : rule.avoid, sourceKeys: rule.sourceKeys, eventDate: ev.date });
      }
    });
  });
  return flags;
}

// ---- Fertilizer windows (proactive, calendar-based reminders) ----
// GUARDRAILS above only complains about a fertilizer application AFTER it's been logged late.
// This looks forward from the transplant date instead, so the farmer can see the window
// coming rather than finding out afterward that they missed it. Uses the exact same sourced
// numbers already used in GUARDRAILS.fertilizer_too_late and the fertilizer calculator's
// suggested rates (30 / 45 days after transplanting, JICA/SHEP guide) — this is not a new
// guideline, just a forward-looking view of one that already existed.
// Deliberately calendar-anchored rather than observation-anchored: unlike morphology checks
// (leaf count, height, which genuinely vary by how a season is going), the sources themselves
// give fertilizer timing as a day-count from transplanting, so counting down days is honest
// here in a way it wouldn't be for something like transplant readiness.
// Window 2 only ever appears once window 1 has actually been logged (by design decision) —
// showing two countdowns before the farmer has done the first one adds noise, not clarity.
const FERTILIZER_WINDOWS = [
  {
    windowNumber: 1,
    targetDay: 30,
    label: "Top-dress 1 (DAP/CAN)",
    guidance: "The first split top-dress application is typically due around 30 days after transplanting.",
    sourceKeys: ["G1", "KE1", "G7"]
  },
  {
    windowNumber: 2,
    targetDay: 45,
    label: "Top-dress 2 (DAP/CAN)",
    guidance: "The second split top-dress application is typically due around 45 days after transplanting. Guidance is to stop fertilizing entirely at least 4 weeks before harvest after this.",
    sourceKeys: ["G1", "KE1", "G7"]
  }
];

const FERTILIZER_WINDOWS_SW = {
  1: {
    label: "Kuweka mbolea ya kwanza (DAP/CAN)",
    guidance: "Uwekaji wa kwanza wa mbolea ya kugawanya kwa kawaida huhitajika karibu siku 30 baada ya kuhamisha miche."
  },
  2: {
    label: "Kuweka mbolea ya pili (DAP/CAN)",
    guidance: "Uwekaji wa pili wa mbolea ya kugawanya kwa kawaida huhitajika karibu siku 45 baada ya kuhamisha miche. Muongozo unashauri kusimamisha mbolea kabisa angalau wiki 4 kabla ya kuvuna baada ya hapo."
  }
};

function buildFertilizerWindowResult(w, daysUntil){
  const sw = currentLang === "sw" ? FERTILIZER_WINDOWS_SW[w.windowNumber] : null;
  const display = sw ? Object.assign({}, w, sw) : w;
  let urgency;
  if(daysUntil < 0) urgency = "overdue";
  else if(daysUntil <= 7) urgency = "dueSoon";
  else urgency = "upcoming";
  return { windowNumber: w.windowNumber, window: display, daysUntil: daysUntil, urgency: urgency };
}

function evaluateFertilizerWindows(heroPhase, transplantEvent, events, seasonAnchorDate){
  if(heroPhase !== "growing" || !transplantEvent) return [];
  const anchor = transplantAnchorDate(transplantEvent);
  const inSeason = function(ev){ return !seasonAnchorDate || ev.date >= seasonAnchorDate; };
  const fertEvents = events.filter(function(ev){
    return ev.categoryId === "fertilizer" && ev.date >= anchor && inSeason(ev);
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });

  const daysSinceTransplant = daysSince(anchor);
  const results = [];

  const window1Done = fertEvents.length >= 1;
  if(!window1Done){
    results.push(buildFertilizerWindowResult(FERTILIZER_WINDOWS[0], FERTILIZER_WINDOWS[0].targetDay - daysSinceTransplant));
  } else if(fertEvents.length < 2){
    results.push(buildFertilizerWindowResult(FERTILIZER_WINDOWS[1], FERTILIZER_WINDOWS[1].targetDay - daysSinceTransplant));
  }

  return results;
}

// ---- Fertilizer Safety ----
// Crop-agnostic on purpose: this is basic fertilizer chemistry (ammonia toxicity to
// germinating seeds/young roots, and calcium-phosphate lock-up when incompatible products are
// mixed), not an onion-specific fact. The same rules apply whatever gets planted in this
// nursery bed next. Verified against real sources before shipping — the DAP-ammonia mechanism
// against the exact source the user provided (MCN1), the relative toxicity ranking (urea more
// dangerous than DAP, DAP more dangerous than MAP/compost) against Field Crop News (FCN1), and
// the calcium+phosphate lock-up chemistry against Purdue's Vegetable Crops Hotline (PU1).
const FERTILIZER_RISK_PROFILE = {
  "DAP": { riskyNearSeedlings: true, containsCalcium: false, containsPhosphate: true },
  "Urea": { riskyNearSeedlings: true, containsCalcium: false, containsPhosphate: false },
  "CAN": { riskyNearSeedlings: true, containsCalcium: true, containsPhosphate: false },
  "Calcium Nitrate": { riskyNearSeedlings: true, containsCalcium: true, containsPhosphate: false },
  "NPK compound": { riskyNearSeedlings: true, containsCalcium: false, containsPhosphate: true },
  "Compost / manure": { riskyNearSeedlings: false, containsCalcium: false, containsPhosphate: false },
  "Other": { riskyNearSeedlings: false, containsCalcium: false, containsPhosphate: false }
};
function fertilizersIncompatible(typeA, typeB){
  const a = FERTILIZER_RISK_PROFILE[typeA], b = FERTILIZER_RISK_PROFILE[typeB];
  if(!a || !b) return false;
  // Phosphate + calcium is the classic lock-up: they form insoluble calcium phosphate.
  return (a.containsPhosphate && b.containsCalcium) || (a.containsCalcium && b.containsPhosphate);
}

function evaluateFertilizerSafety(events, seasonAnchorDate, sowingEvent){
  const inSeason = function(ev){ return !seasonAnchorDate || ev.date >= seasonAnchorDate; };
  const fertEvents = events.filter(function(ev){ return ev.categoryId === "fertilizer" && ev.fertilizerType && inSeason(ev); })
    .sort(function(a,b){ return a.date.localeCompare(b.date); });
  const flags = [];
  const sw = currentLang === "sw";

  fertEvents.forEach(function(ev){
    const profile = FERTILIZER_RISK_PROFILE[ev.fertilizerType];
    const name = optionLabel(ev.fertilizerType);
    // A risky product logged after the sowing day itself (not same-day bed prep) means it was
    // most likely applied at or near already-germinating seedlings, not mixed into the bed
    // before anything was planted.
    if(profile && profile.riskyNearSeedlings && sowingEvent && ev.date > sowingEvent.date){
      flags.push({
        id: "fertilizer_unsafe_near_seedlings",
        label: sw ? (name + " iliwekwa karibu na miche michanga") : (ev.fertilizerType + " applied near young seedlings"),
        severity: "critical",
        message: sw
          ? (name + " hutoa hewa ya amonia na/au chumvi kali karibu na mbegu na mizizi, jambo linaloweza kukausha au kuchoma miche michanga. Mboji, samadi iliyooza vizuri, au mbolea nyepesi ya maji baada ya majani halisi kutokea ndiyo chaguo salama kwenye kitalu.")
          : (ev.fertilizerType + " releases ammonia and/or a strong salt effect close to seeds and roots, which can dehydrate or burn young seedlings. Compost, well-rotted manure, or a dilute liquid feed after true leaves appear are the safe nursery options."),
        avoid: sw
          ? ("Usiweke " + name + " moja kwa moja kwenye tuta la kitalu au karibu na mizizi ya miche. Ikitumika, iwe imechanganywa vizuri kwenye udongo muda mrefu kabla ya kupanda, umbali wa sentimita kadhaa kutoka mahali mbegu itakapowekwa.")
          : ("Don't apply " + ev.fertilizerType + " directly to a nursery bed or close to seedling roots. If used at all, it belongs mixed into the soil well before sowing, several cm away from where the seed goes."),
        sourceKeys: ["MCN1", "FCN1"],
        eventDate: ev.date
      });
    }
  });

  for(var i = 1; i < fertEvents.length; i++){
    const prev = fertEvents[i-1], curr = fertEvents[i];
    const gapDays = daysBetween(prev.date, curr.date);
    if(gapDays != null && gapDays <= 7 && fertilizersIncompatible(prev.fertilizerType, curr.fertilizerType)){
      const prevName = optionLabel(prev.fertilizerType), currName = optionLabel(curr.fertilizerType);
      flags.push({
        id: "fertilizer_incompatible_pair",
        label: sw ? (prevName + " na " + currName + " ziliwekwa karibu kwa muda") : (prev.fertilizerType + " and " + curr.fertilizerType + " applied close together"),
        severity: "high",
        message: sw
          ? "Mbolea zenye fosifeti (kama DAP au aina za NPK) na mbolea zenye kalisi (kama CAN au calcium nitrate) zinapochanganyika hutengeneza calcium phosphate, ambayo haiyeyuki na haina faida kwa mmea."
          : "Phosphate-based fertilizers (like DAP or NPK compounds) and calcium-based fertilizers (like CAN or calcium nitrate) react together to form calcium phosphate, which is insoluble and useless to the plant.",
        avoid: sw
          ? "Ziweke kwa nafasi ya muda, au chagua moja kati ya hizo kwa uwekaji mmoja badala ya kuzichanganya."
          : "Space these out, or pick one or the other for a given application rather than combining them.",
        sourceKeys: ["PU1"],
        eventDate: curr.date
      });
    }
  }
  return flags;
}

function observationSummaryText(o){
  if(o.notes && o.notes.trim()) return o.notes.trim();
  const parts = [];
  if(o.observedStage) parts.push(o.observedStage);
  if(o.leafCount != null && o.leafCount !== "") parts.push(o.leafCount + " leaves");
  if(o.heightCm != null && o.heightCm !== "") parts.push(o.heightCm + "cm");
  if(o.soilMoisture) parts.push("Soil: " + o.soilMoisture);
  if(o.leafColor) parts.push("Leaf: " + o.leafColor);
  if(o.pestPresence && o.pestPresence !== "None seen") parts.push("Pest: " + o.pestPresence);
  if(o.diseaseSymptoms && o.diseaseSymptoms !== "None seen") parts.push("Disease: " + o.diseaseSymptoms);
  return parts.length ? parts.join(" · ") : "Field check logged";
}

// Merges the quick observation notes on fertilizer/spray events with the dedicated
// Observation log, and returns whichever is most recent, in one shared shape.
function latestFieldNote(state){
  const items = [];
  state.events.forEach(function(ev){
    if(ev.observation && ev.observation.trim()){
      items.push({ date: ev.date, text: ev.observation.trim(), source: eventDisplayName(ev) });
    }
  });
  (state.observations || []).forEach(function(o){
    items.push({ date: o.date, text: observationSummaryText(o), source: "Field observation" });
  });
  if(items.length === 0) return null;
  return items.sort(function(a,b){ return b.date.localeCompare(a.date); })[0];
}

// Shared by HomeScreen and WhyScreen so both always agree on the current season phase.
function computeSeasonPhase(events){
  function latestOf(catId, sinceDate){
    const matches = events.filter(function(ev){ return ev.categoryId === catId && (!sinceDate || ev.date >= sinceDate); });
    if(matches.length === 0) return null;
    return matches.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).pop();
  }
  const sowingEvent = latestOf("sowing", null);
  // Season anchor is normally the most recent Sowing. If a farmer bought seedlings and never
  // logged a Sowing/nursery step at all, fall back to Transplanting so the season can still
  // start (and correctly skips straight to the Growing phase, never a phantom nursery phase).
  const seasonAnchor = sowingEvent || latestOf("transplanting", null);
  function latestInSeason(catId){
    if(!seasonAnchor) return null;
    return latestOf(catId, seasonAnchor.date);
  }
  const transplantEvent = latestInSeason("transplanting");
  const harvestEvent = latestInSeason("harvest");
  const dispositionEvent = latestInSeason("stored_sold");

  // Walk the milestone sequence (sowing -> transplant -> harvest -> disposition) and only
  // advance the phase when the next milestone's date is at or after the one before it. This
  // stops two things: a leftover disposition/harvest from an earlier season sealing a new
  // season shut just because it shares the same (old) sowing anchor (a new Transplanting
  // logged after the old season's Stored/Sold should reopen the season as "growing", not stay
  // "complete"), and a backdated/out-of-order harvest producing an impossible phase.
  let heroPhase = null;
  let phaseAnchorDate = null;
  if(seasonAnchor){
    heroPhase = sowingEvent ? "germination" : "growing";
    phaseAnchorDate = seasonAnchor.date;
    if(transplantEvent && transplantAnchorDate(transplantEvent) >= phaseAnchorDate){
      heroPhase = "growing";
      phaseAnchorDate = transplantAnchorDate(transplantEvent);
    }
    if(harvestEvent && harvestEvent.date >= phaseAnchorDate){
      heroPhase = "drying";
      phaseAnchorDate = harvestEvent.date;
    }
    if(dispositionEvent && dispositionEvent.date >= phaseAnchorDate){
      heroPhase = "complete";
      phaseAnchorDate = dispositionEvent.date;
    }
  }
  const heroAnchorEvent = heroPhase === "growing" ? transplantEvent
    : heroPhase === "drying" ? harvestEvent
    : heroPhase === "complete" ? dispositionEvent
    : (heroPhase === "germination" ? sowingEvent : null);
  const cropAge = heroAnchorEvent ? daysSince(heroPhase === "growing" ? transplantAnchorDate(heroAnchorEvent) : heroAnchorEvent.date) : null;
  const heroStageLabel = heroPhase === "growing" ? stageForTransplantDays(cropAge)
    : heroPhase === "drying" ? DRYING_LABEL
    : heroPhase === "complete" ? COMPLETE_LABEL
    : GERMINATION_LABEL;
  // Only meaningful in the growing phase, and only non-null when transplanting actually spanned
  // multiple days — lets a screen show "12-18 DAT" instead of a single (potentially misleading) age.
  const transplantDatRangeInfo = heroPhase === "growing" ? transplantDatRange(transplantEvent) : null;
  return { sowingEvent: sowingEvent, transplantEvent: transplantEvent, harvestEvent: harvestEvent, dispositionEvent: dispositionEvent,
    heroPhase: heroPhase, cropAge: cropAge, heroStageLabel: heroStageLabel, heroAnchorEvent: heroAnchorEvent,
    transplantDatRange: transplantDatRangeInfo };
}

function HomeScreen(state){
  const withOrd = useMemo(function(){ return withOrdinals(state.events.slice()); }, [state.events]);

  const seasonPhase = useMemo(function(){ return computeSeasonPhase(state.events); }, [state.events]);
  const sowingEvent = seasonPhase.sowingEvent, transplantEvent = seasonPhase.transplantEvent,
    harvestEvent = seasonPhase.harvestEvent, dispositionEvent = seasonPhase.dispositionEvent,
    heroPhase = seasonPhase.heroPhase, cropAge = seasonPhase.cropAge, heroStageLabel = seasonPhase.heroStageLabel,
    transplantDatRange = seasonPhase.transplantDatRange;

  // Routine actions (fertilizer, mulch, etc.) are scoped to the CURRENT phase only. Without
  // this, a nursery-time fertilizer or a mulch that was removed once early on would keep
  // showing up as "last done" evidence for the entirely different post-transplant version of
  // that same activity. Only events logged since the current phase's own anchor count.
  const latestByCat = useMemo(function(){
    const map = {};
    const since = seasonPhase.heroAnchorEvent ? seasonPhase.heroAnchorEvent.date : null;
    withOrd.forEach(function(ev){
      if(since && ev.date < since) return;
      if(!map[ev.categoryId] || ev.date > map[ev.categoryId].date) map[ev.categoryId] = ev;
    });
    return map;
  }, [withOrd, seasonPhase.heroAnchorEvent]);
  const nextActionCats = useMemo(function(){
    // Ranked by days-since-last-done, most overdue first — not by a fixed category order.
    // Previously this just sliced the first 3 categories in FULL_PRIORITY's fixed order, so a
    // category logged yesterday could push out one that's weeks overdue simply by coming
    // earlier in that list.
    return priorityCatsForPhase(heroPhase)
      .filter(function(id){ return !!latestByCat[id]; })
      .slice()
      .sort(function(a, b){ return daysSince(latestByCat[b].date) - daysSince(latestByCat[a].date); })
      .slice(0, 3);
  }, [latestByCat, heroPhase]);
  const hasAnyEvents = state.events.length > 0;
  const engineCheck = useMemo(function(){ return evaluateBaselineCheck(heroPhase, heroStageLabel, state.observations, sowingEvent ? sowingEvent.date : null); }, [heroPhase, heroStageLabel, state.observations, sowingEvent]);
  const nurseryMulchAction = useMemo(function(){
    return evaluateOneTimeAction("removeNurseryMulch", heroPhase, state.events, seasonPhase.sowingEvent ? seasonPhase.sowingEvent.date : null);
  }, [heroPhase, state.events, seasonPhase.sowingEvent]);
  const erectShadeAction = useMemo(function(){
    return evaluateSunlightAction("erectShade", heroPhase, state.observations, seasonPhase.sowingEvent ? seasonPhase.sowingEvent.date : null);
  }, [heroPhase, state.observations, seasonPhase.sowingEvent]);
  const removeShadeAction = useMemo(function(){
    return evaluateSunlightAction("removeShadeGradually", heroPhase, state.observations, seasonPhase.sowingEvent ? seasonPhase.sowingEvent.date : null);
  }, [heroPhase, state.observations, seasonPhase.sowingEvent]);
  const threats = useMemo(function(){
    return evaluateThreatMap(heroPhase, heroStageLabel, state.observations, sowingEvent ? sowingEvent.date : null);
  }, [heroPhase, heroStageLabel, state.observations, sowingEvent]);
  const fertilizerSafetyFlags = useMemo(function(){
    return evaluateFertilizerSafety(state.events, sowingEvent ? sowingEvent.date : null, sowingEvent).filter(function(f){ return f.severity === "critical" || f.severity === "high"; });
  }, [state.events, sowingEvent]);
  const nurseryPace = useMemo(function(){
    return heroPhase === "germination" ? evaluateNurseryPace(sowingEvent, state.observations) : null;
  }, [heroPhase, sowingEvent, state.observations]);
  const fertilizerWindows = useMemo(function(){
    return evaluateFertilizerWindows(heroPhase, transplantEvent, state.events, sowingEvent ? sowingEvent.date : null);
  }, [heroPhase, transplantEvent, state.events, sowingEvent]);

  // Threat Map cards auto-hide from Home after 24h or a new event/observation, whichever first.
  const totalEntries = state.events.length + (state.observations ? state.observations.length : 0);
  const [threatSeenLog, setThreatSeenLog] = useState(loadThreatSeenLog);
  useEffect(function(){
    const log = Object.assign({}, threatSeenLog);
    let changed = false;
    threats.forEach(function(t){
      const key = t.id + "|" + t.observationDate;
      if(!log[key]){ log[key] = { firstSeenAt: Date.now(), entriesAtFirstSeen: totalEntries }; changed = true; }
    });
    if(changed){ setThreatSeenLog(log); saveThreatSeenLog(log); }
  }, [threats, totalEntries]);
  const visibleThreats = useMemo(function(){
    const DAY_MS = 24 * 60 * 60 * 1000;
    return threats.filter(function(t){
      const seen = threatSeenLog[t.id + "|" + t.observationDate];
      if(!seen) return true;
      const expired = (Date.now() - seen.firstSeenAt) > DAY_MS;
      const hasNewEntry = totalEntries > seen.entriesAtFirstSeen;
      return !expired && !hasNewEntry;
    });
  }, [threats, threatSeenLog, totalEntries]);

  return e("div", { className:"home-wrap" },
    e("div", { className:"header" },
      e("div", { className:"farmrow" },
        e("div", null,
          e("div", { className:"farmname" }, state.farm.name || (currentLang === "sw" ? "Shamba Langu" : "My Farm")),
          e("div", { className:"date" }, new Date().toLocaleDateString(currentLang === "sw" ? "sw" : "en-GB", { weekday:"long", day:"numeric", month:"long" }))
        ),
        e("span", { className:"badge" }, state.farm.cropType === "onion" ? (currentLang === "sw" ? "Vitunguu" : "Onion") : state.farm.cropType)
      )
    ),

    e("div", { className:"home-body" },

      // How is the crop doing? — hero panel: age and growth stage, re-anchored to
      // whichever season phase is currently active (sowing / transplanting / harvest / stored-sold).
      e("div", { className:"hero" },
        e("div", { className:"hero-ring-wrap" }, e(RingHero, { days: cropAge === null ? 0 : cropAge, complete: heroPhase === "complete" })),
        e("div", { className:"hero-text" },
          heroPhase === null
            ? e("div", { className:"hero-sub" }, t("home.logSowingPrompt"))
            : heroPhase === "complete"
            ? e(React.Fragment, null,
                e("div", { className:"hero-num mono" }, dispositionEvent.quantityGunia || "—"),
                e("div", { className:"hero-label" }, (dispositionEvent.outcome === "Sold" ? t("home.guniaSold") : t("home.guniaStored"))),
                e("div", { className:"hero-sub" }, t("home.seasonComplete") + " · " + relativeLabel(daysSince(dispositionEvent.date)) + " · " + (currentLang === "sw" ? "weka tarehe mpya ya kupanda kuanza msimu ujao" : "log a new sowing to start next season"))
              )
            : e(React.Fragment, null,
                e("div", { className:"hero-num mono" }, cropAge),
                e("div", { className:"hero-label" }, (currentLang === "sw" ? "siku tangu " : (cropAge === 1 ? "day since " : "days since ")) + (currentLang === "sw"
                  ? (heroPhase === "growing" ? "kuhamisha miche" : heroPhase === "drying" ? "kuvuna" : "kupanda")
                  : (heroPhase === "growing" ? "transplanting" : heroPhase === "drying" ? "harvest" : "sowing"))),
                e("div", { className:"hero-sub" }, stageLabelDisplay(heroStageLabel)),
                nurseryPace && nurseryPace.status !== "insufficient" && e("div", { className:"hero-sub", style:{ opacity:0.75, marginTop:"3px", fontSize:"12.5px" } },
                  nurseryPace.inTransplantWindow
                    ? t("pace.inWindow") + " \u00b7 " + t("pace.readyNow")
                    : t("pace." + nurseryPace.status) + (nurseryPace.daysToTarget != null
                      ? " \u00b7 ~" + nurseryPace.daysToTarget + " " + t("pace.daysToTransplant")
                      : "")

// Shared collapsible-card shell for every card on the Why screen (engine advisory, one-time
// action, threat, routine action, guardrail note). Guarantees identical collapsed dimensions
// across all of them — collapsed always shows just title + one badge/summary line, nothing
// else — and lets a tap ANYWHERE on the card (not just the header) toggle it, per the user's
// request. Content passed as children only renders while open, so it never affects collapsed
// height. A tap inside the open content (e.g. a source link) stops propagation so it doesn't

      e("span", { className:"why-collapsible-chev" }, open ? "\u2212" : "+")

function App(){
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState("home");
  const [whyFocus, setWhyFocus] = useState(null);
  const [lang, setLang] = useState(function(){
    try{ return localStorage.getItem(LANG_KEY) || "en"; }catch(err){ return "en"; }
  });
  currentLang = lang; // must be set before this render's tree is built so every t() call below (and in child components called during this render) reflects it
  useEffect(function(){ try{ localStorage.setItem(LANG_KEY, lang); }catch(err){} }, [lang]);
  useEffect(function(){ saveState(state); }, [state]);
  useEffect(function(){ document.body.style.overflow = tab === "home" ? "hidden" : ""; }, [tab]);

  // --- Shared farm sync (optional) -----------------------------------------------------------
  const [syncMeta, setSyncMeta] = useState(loadSyncMeta);
  const stateRef = useRef(state);
  useEffect(function(){ stateRef.current = state; }, [state]);
  const skipNextSyncPush = useRef(false); // set right before a remote-driven setState, so that change doesn't get pushed straight back out
  const isFirstStateEffect = useRef(true); // the very first [state] effect run is just the initial mount, never a real edit — must not be treated as one, or every app-open would race the other device's last edit with a meaningless "nothing changed" timestamp

  // Subscribe to the shared farm's live data, and to Firebase's connectivity signal so any
  // edit made while offline gets pushed the moment a connection is available. Re-subscribes
  // whenever the farm code changes (create/join/leave), cleanly unsubscribing the old one.
  useEffect(function(){
    if(!syncMeta.farmCode) return;
    const code = syncMeta.farmCode;
    const unsubData = fbSubscribe(code, function(remote){
      if(!remote) return;
      setSyncMeta(function(prevMeta){
        if(prevMeta.farmCode !== code) return prevMeta; // a stale callback from a farm we've since left
        if(remote.updatedAt && remote.updatedAt > prevMeta.updatedAt){
          skipNextSyncPush.current = true;
          setState({ farm: remote.farm, events: remote.events || [], observations: remote.observations || [], areaBeds: remote.areaBeds || [] });
          const nextMeta = { farmCode: code, updatedAt: remote.updatedAt, needsSync:false };
          saveSyncMeta(nextMeta);
          return nextMeta;
        }
        return prevMeta;
      });
    });
    const unsubConn = fbSubscribeConnectivity(function(isConnected){
      if(!isConnected) return;
      setSyncMeta(function(prevMeta){
        if(prevMeta.farmCode === code && prevMeta.needsSync){
          fbPushState(code, stateRef.current, prevMeta.updatedAt).then(function(){
            setSyncMeta(function(m){
              if(m.farmCode !== code || m.updatedAt !== prevMeta.updatedAt) return m; // superseded by a newer edit or a farm switch since this push started
              const cleared = Object.assign({}, m, { needsSync:false });
              saveSyncMeta(cleared);
              return cleared;
            });
          }).catch(function(){});
        }
        return prevMeta;
      });
    });
    return function(){ unsubData(); unsubConn(); };
  }, [syncMeta.farmCode]);

  // Push every genuine local edit to the shared farm (if one is set up). Skips the initial
  // mount (not a real edit) and skips whenever this exact state change came FROM the remote
  // subscription above (nothing new to send back).
  useEffect(function(){
    if(isFirstStateEffect.current){ isFirstStateEffect.current = false; return; }
    if(skipNextSyncPush.current){ skipNextSyncPush.current = false; return; }
    setSyncMeta(function(prevMeta){
      const nextMeta = { farmCode: prevMeta.farmCode, updatedAt: Date.now(), needsSync: !!prevMeta.farmCode };
      saveSyncMeta(nextMeta);
      if(prevMeta.farmCode){
        fbPushState(prevMeta.farmCode, state, nextMeta.updatedAt).then(function(){
          setSyncMeta(function(m){
            if(m.updatedAt !== nextMeta.updatedAt) return m; // a newer local edit already superseded this push
            const cleared = Object.assign({}, m, { needsSync:false });
            saveSyncMeta(cleared);
            return cleared;
          });
        }).catch(function(){});
      }
      return nextMeta;
    });
  }, [state]);

  // Create a brand-new shared farm, seeded with this device's current data.
  function createSharedFarm(){
    const code = generateFarmCode();
    const ts = Date.now();
    return fbPushState(code, stateRef.current, ts).then(function(){
      const meta = { farmCode: code, updatedAt: ts, needsSync:false };
      saveSyncMeta(meta); setSyncMeta(meta);
      return code;
    });
  }
  // Join an existing shared farm by code, replacing this device's local data with whatever's
  // already in that shared farm (this device's own prior local-only data is not merged in —
  // joining means "show me what's already there", same mental model as restoring a backup).
  function joinSharedFarm(code){
    return fbFetchState(code).then(function(remote){
      if(!remote) return { ok:false, reason:"not-found" };
      skipNextSyncPush.current = true;
      setState({ farm: remote.farm, events: remote.events || [], observations: remote.observations || [], areaBeds: remote.areaBeds || [] });
      const meta = { farmCode: code, updatedAt: remote.updatedAt || Date.now(), needsSync:false };
      saveSyncMeta(meta); setSyncMeta(meta);
      return { ok:true };
    });
  }
  // Stops syncing — this device's local data stays exactly as it is, it just stops sending or

      )
    ),

    obsModalOpen && e("div", { className:"modal-overlay", onClick: function(ev){ if(ev.target===ev.currentTarget) setObsModalOpen(false); } },
      e("div", { className:"modal" },
        e("h2", null, obsEditingId ? t("modal.editObservation") : t("modal.addObservation")),
        e("div", { className:"hint", style:{ marginBottom:"12px" } }, t("field.fillOnlyWhatSeen")),
        e("div", { className:"field" }, e("label", null, t("field.date")),
          e("input", { type:"date", value: obsDate, onChange: function(ev){ setObsDate(ev.target.value); } })),
        e(OptionalSelect, { label:t("field.growthStage"), value: obsStage, onChange: setObsStage, options: OBS_STAGE_OPTIONS }),
        e("div", { className:"field" }, e("label", null, t("field.leafCount")),
          e("input", { type:"number", min:"0", inputMode:"numeric", value: obsLeafCount, placeholder:"e.g. 4", onChange: function(ev){ setObsLeafCount(ev.target.value); } })),
        e("div", { className:"field" }, e("label", null, t("field.plantHeight")),
          e("input", { type:"number", min:"0", inputMode:"decimal", value: obsHeightCm, placeholder:"e.g. 15", onChange: function(ev){ setObsHeightCm(ev.target.value); } })),
        e(OptionalSelect, { label:t("field.soilMoisture"), value: obsMoisture, onChange: setObsMoisture, options: OBS_MOISTURE_OPTIONS }),
        e(OptionalSelect, { label:t("field.leafColour"), value: obsLeafColor, onChange: setObsLeafColor, options: OBS_LEAF_COLOR_OPTIONS }),
        e(OptionalSelect, { label:t("field.pestsSeen"), value: obsPest, onChange: setObsPest, options: OBS_PEST_OPTIONS }),
        e(OptionalSelect, { label:t("field.diseaseSymptoms"), value: obsDisease, onChange: setObsDisease, options: OBS_DISEASE_OPTIONS }),
        e(OptionalSelect, { label:t("field.topsStatus"), value: obsTops, onChange: setObsTops, options: OBS_TOPS_OPTIONS }),
        e(OptionalSelect, { label:t("field.curingStatus"), value: obsCuring, onChange: setObsCuring, options: OBS_CURING_OPTIONS }),
        e(OptionalSelect, { label:t("field.sunlightEffect"), value: obsSunlight, onChange: setObsSunlight, options: OBS_SUNLIGHT_OPTIONS }),
        e(OptionalSelect, { label:t("field.weather"), value: obsWeather, onChange: setObsWeather, options: OBS_WEATHER_OPTIONS }),
        e("div", { className:"field" }, e("label", null, t("field.notes")),
          e("textarea", { value: obsNotes, placeholder:t("field.notesPlaceholder"), onChange: function(ev){ setObsNotes(ev.target.value); } })),
        e("div", { className:"modal-actions" },
          e("button", { className:"btn btn-secondary", onClick: function(){ setObsModalOpen(false); } }, t("common.cancel")),
          e("button", { className:"btn btn-primary", onClick: submitObsForm }, obsEditingId ? t("common.save") : t("common.add"))
        )
      )
    ),

    obsConfirmDeleteId && e("div", { className:"modal-overlay", onClick: function(ev){ if(ev.target===ev.currentTarget) setObsConfirmDeleteId(null); } },
      e("div", { className:"modal" },
        e("h2", null, t("modal.deleteObservationQ")),
        e("div", { className:"hint" }, t("common.cantBeUndone")),
        e("div", { className:"modal-actions" },
          e("button", { className:"btn btn-secondary", onClick: function(){ setObsConfirmDeleteId(null); } }, t("common.cancel")),
          e("button", { className:"btn btn-primary", style:{background:"var(--status-danger)", color:"#fff"}, onClick: function(){ deleteObservation(obsConfirmDeleteId); setObsConfirmDeleteId(null); } }, t("common.delete"))
        )
      )
    ),

    e("div", { className:"bottom-nav" },
      e("div", { className:"bottom-nav-inner" },
        e("button", { className:"nav-btn" + (tab==="home" ? " active" : ""), onClick: function(){ setTab("home"); } }, IconHome(tab==="home"), e("span", null, t("nav.home"))),
        e("button", { className:"nav-btn" + (tab==="why" ? " active" : ""), onClick: function(){ setTab("why"); } }, IconWhy(tab==="why"), e("span", null, t("nav.why"))),
        e("button", { className:"nav-btn" + (tab==="history" ? " active" : ""), onClick: function(){ setTab("history"); } }, IconHistory(tab==="history"), e("span", null, t("nav.history"))),
        e("button", { className:"nav-btn" + (tab==="settings" ? " active" : ""), onClick: function(){ setTab("settings"); } }, IconSettings(tab==="settings"), e("span", null, t("nav.settings")))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(err){
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
</body>
</html>
