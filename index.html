<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japhe Farm">
<title>Japhe Farm: Onion Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#0d1512;
    --bg-surface:#141f19;
    --bg-elevated:#1c2b22;
    --text-primary:#eef2ea;
    --text-secondary:#93a99c;
    --text-muted:#5c7266;
    --accent:#4fae68;
    --accent-dark:#173325;
    --accent-sage:#7a9c85;
    --accent-dim:rgba(79,174,104,0.16);
    --status-success:#4fae68;
    --status-warning:#e0a83f;
    --status-danger:#d1603f;
    --border-subtle:#22302a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg-primary);color:var(--text-primary);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;}
  #root{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}

  .header{padding:20px 20px 4px;}
  .header .farmrow{display:flex; align-items:center; justify-content:space-between;}
  .header .farmname{font-size:17px; font-weight:700;}
  .header .date{font-size:12px; color:var(--text-secondary); margin-top:2px;}
  .badge{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
    background:var(--accent-dim);color:var(--accent);
    padding:4px 9px;border-radius:20px;
  }

  .home-wrap{ height:calc(100dvh - 76px); display:flex; flex-direction:column; overflow:hidden; }
  .home-body{ flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto; padding-bottom:calc(4px + env(safe-area-inset-bottom)); }

  .hero{
    margin:10px 16px 0; background:var(--accent-dark); border-radius:22px;
    padding:20px 20px; position:relative; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; gap:16px; border:1px solid var(--border-subtle);
  }
  .hero::before{content:""; position:absolute; right:-30px; top:-30px; width:150px; height:150px; border-radius:50%; border:22px solid rgba(255,255,255,0.04);}
  .hero::after{content:""; position:absolute; right:18px; bottom:-40px; width:90px; height:90px; border-radius:50%; border:16px solid rgba(255,255,255,0.04);}
  .hero-ring-wrap{position:relative; width:78px; height:78px; flex-shrink:0;}
  .hero-num{font-size:36px; font-weight:800; color:#fff; line-height:1;}
  .hero-label{font-size:11px; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px;}
  .hero-sub{font-size:13.5px; color:rgba(255,255,255,0.8); margin-top:7px;}

  .attention-group{ flex:1; min-height:0; display:flex; flex-direction:column; padding:0 0 6px; }
  .section-label.tight{ margin:12px 0 7px; flex-shrink:0; }
  .card-list.tight{ flex:1; min-height:0; display:flex; flex-direction:column; gap:7px; overflow-y:auto; }
  .card-list.tight > .card-btn{ flex:0 0 auto; max-height:64px; }
  .card-btn{ box-sizing:border-box; display:block; width:100%; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .card-btn .event-card{ height:100%; box-sizing:border-box; }
  .card-list.tight .event-card{ padding:9px 14px; }
  .card-list.tight .ring-wrap{ width:36px; height:36px; }
  .card-list.tight .ring-num{ font-size:12px; }
  .card-list.tight .ev-name{ font-size:13px; }
  .card-list.tight .ev-sub{ font-size:11px; }
  .card-list.tight.one{ flex:0 0 auto; }
  .card-list.tight.one > .card-btn{ flex:0 0 auto; max-height:64px; }
  .card-list.tight.one .ring-wrap{ width:40px; height:40px; }

  .advisory-card{
    box-sizing:border-box; display:flex; align-items:center; gap:10px; cursor:pointer;
    margin:12px 16px 0; padding:12px 14px; border-radius:14px; -webkit-tap-highlight-color:transparent;
    background:rgba(143,224,164,0.14); border:1px solid rgba(143,224,164,0.35);
  }
  .advisory-card.partial{ background:rgba(240,198,117,0.14); border-color:rgba(240,198,117,0.35); }
  .advisory-card.threat-medium{ background:rgba(240,198,117,0.14); border-color:rgba(240,198,117,0.35); }
  .advisory-card.threat-high{ background:rgba(240,161,127,0.16); border-color:rgba(240,161,127,0.4); }
  .advisory-card.threat-critical{ background:rgba(224,110,110,0.18); border-color:rgba(224,110,110,0.5); }
  .advisory-card .advisory-title{ font-size:13.5px; font-weight:700; color:var(--text-primary); }
  .advisory-card .advisory-sub{ font-size:11.5px; color:var(--text-secondary); margin-top:2px; }
  .advisory-card .chev{ color:var(--text-muted); font-size:16px; margin-left:auto; }

  .hero-text{ min-width:0; flex:1; }
  .health-pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; vertical-align:middle; }
  .health-pill .dot{ width:6px; height:6px; border-radius:50%; }
  .health-pill.ok{ background:rgba(79,174,104,0.2); color:#8fe0a4; }
  .health-pill.ok .dot{ background:#8fe0a4; }
  .health-pill.warn{ background:rgba(224,168,63,0.2); color:#f0c675; }
  .health-pill.warn .dot{ background:#f0c675; }
  .health-pill.danger{ background:rgba(209,96,63,0.2); color:#f0a17f; }
  .health-pill.danger .dot{ background:#f0a17f; }
  .health-pill.neutral{ background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.65); }
  .health-pill.neutral .dot{ background:rgba(255,255,255,0.65); }

  .obs-card{
    margin:0 16px; background:var(--bg-surface); border:1px solid var(--border-subtle);
    border-radius:16px; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0;
  }
  .obs-card .ev-mid{ min-width:0; flex:1; }
  .obs-card .ev-sub{ font-size:11.5px; color:var(--text-secondary); margin-top:3px; }
  .obs-text{ font-size:13px; font-style:italic; line-height:1.35; color:var(--text-primary); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .empty-state.compact{ margin:10px 20px 0; padding:14px 16px; font-size:12.5px; flex-shrink:0; }

  .section-label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--text-muted); padding:0 20px; margin:22px 0 10px;
    display:flex; align-items:center; justify-content:space-between;
  }

  .card-list{padding:0 16px; display:flex; flex-direction:column; gap:10px;}
  .event-card{
    background:var(--bg-surface); border:1px solid var(--border-subtle);
    border-radius:16px; padding:14px 16px;
    display:flex; align-items:center; gap:14px;
  }
  .event-card.placeholder{ border-style:dashed; opacity:0.75; }
  .ring-wrap{position:relative; width:52px; height:52px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;}
  .ring-num.neutral{ color:var(--accent-sage); }
  .event-card .ev-mid{min-width:0; flex:1;}
  .event-card .ev-name{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .event-card .ev-sub{font-size:12px; color:var(--text-secondary); margin-top:2px;}
  .event-card .ev-obs{font-size:11.5px; color:var(--text-muted); margin-top:3px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ok{color:var(--status-success);}
  .warn{color:var(--status-warning);}
  .danger{color:var(--status-danger);}

  .timeline{padding:6px 20px 0; display:flex; gap:0; overflow-x:auto; -webkit-overflow-scrolling:touch; flex-shrink:0;}
  .timeline::-webkit-scrollbar{display:none;}
  .tl-item{flex-shrink:0; width:98px; display:flex; flex-direction:column; align-items:flex-start; position:relative; padding-right:12px;}
  .tl-dot{width:8px; height:8px; border-radius:50%; background:var(--accent-sage); margin-bottom:6px;}
  .tl-line{position:absolute; top:3px; left:8px; width:100%; height:1px; background:var(--border-subtle);}
  .tl-name{font-size:11.5px; font-weight:600; color:var(--text-primary); line-height:1.25;}
  .tl-date{font-size:10px; color:var(--text-muted); margin-top:2px;}

  .empty-state{margin:20px 20px 0; text-align:center; color:var(--text-secondary); font-size:13.5px; line-height:1.6; background:var(--bg-surface); border:1px dashed var(--border-subtle); border-radius:16px; padding:24px 16px;}

  .timeline-vertical{ margin:0 16px; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:16px; padding:16px; }
  .tlv-item{ display:flex; gap:12px; }
  .tlv-marker{ display:flex; flex-direction:column; align-items:center; }
  .tlv-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent-sage); flex-shrink:0; margin-top:4px; }
  .tlv-line{ width:1px; flex:1; background:var(--border-subtle); margin-top:4px; min-height:22px; }
  .tlv-content{ padding-bottom:16px; min-width:0; }
  .tlv-name{ font-size:13.5px; font-weight:700; }
  .tlv-date{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .empty-state .big{font-size:30px; margin-bottom:8px;}

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(20,31,25,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--border-subtle);
    display:flex; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav-inner{max-width:480px; width:100%; display:flex;}
  .nav-btn{flex:1; background:none; border:none; padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-muted); font-size:11px; font-weight:600;}
  .nav-btn.active{color:var(--accent);}

  .settings-block{margin:0 20px 24px; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:16px; padding:16px;}
  .settings-block h3{margin:0 0 12px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-secondary);}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block; font-size:12px; color:var(--text-secondary); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg-elevated); border:1px solid var(--border-subtle);
    border-radius:10px; padding:11px 12px; color:var(--text-primary); font-size:15px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
  .field select:disabled{color:var(--text-muted);}
  .hint{font-size:11px; color:var(--text-muted); margin-top:6px;}

  .why-block{ background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:16px; padding:16px; }
  .why-title{ font-size:15px; font-weight:700; color:var(--text-primary); margin-bottom:8px; }
  .why-status-row{ margin-bottom:6px; }
  .why-status-badge{ display:inline-block; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .why-status-badge.full{ background:rgba(143,224,164,0.18); color:#8fe0a4; }
  .why-status-badge.partial{ background:rgba(240,198,117,0.18); color:#f0c675; }
  .why-status-badge.none{ background:rgba(240,161,127,0.18); color:#f0a17f; }
  .why-status-badge.no-data{ background:rgba(255,255,255,0.1); color:var(--text-muted); }
  .why-subhead{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin:0; }
  .why-criteria-list{ display:flex; flex-direction:column; gap:12px; }
  .why-criterion{ display:flex; flex-direction:column; gap:2px; font-size:12.5px; }
  .why-crit-field{ font-weight:600; color:var(--text-primary); margin-bottom:2px; }
  .why-crit-expected{ color:var(--text-secondary); }
  .why-crit-observed{ color:var(--text-muted); }

  .why-card-head{ box-sizing:border-box; display:flex; align-items:flex-start; justify-content:space-between; width:100%; cursor:pointer; -webkit-tap-highlight-color:transparent; gap:10px; }
  .why-collapsible-chev{ font-size:15px; font-weight:700; color:var(--text-muted); width:18px; text-align:center; flex-shrink:0; }
  .why-block.threat-medium{ border-color:rgba(240,198,117,0.4); }
  .why-block.threat-high{ border-color:rgba(240,161,127,0.45); }
  .why-block.threat-critical{ border-color:rgba(224,110,110,0.55); background:rgba(224,110,110,0.06); }
  .why-block.guardrail-medium{ border-color:rgba(240,198,117,0.35); }
  .why-block.guardrail-low{ border-color:var(--border-subtle); }
  .why-block.guardrail-high{ border-color:rgba(240,161,127,0.45); }
  .why-block.guardrail-critical{ border-color:rgba(224,110,110,0.55); background:rgba(224,110,110,0.06); }

  .why-source-links{ display:flex; flex-direction:column; gap:6px; }
  .why-source-link{ font-size:11.5px; color:var(--accent); text-decoration:none; word-break:break-word; }

  .backup-text{
    width:100%; min-height:180px; background:var(--bg-elevated); border:1px solid var(--border-subtle);
    border-radius:10px; padding:12px; color:var(--text-primary); font-size:12px; line-height:1.5;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace; resize:vertical;
  }
  .backup-text:focus{outline:none; border-color:var(--accent);}

  .data-row{
    width:100%; background:none; border:none; border-bottom:1px solid var(--border-subtle);
    padding:14px 2px; display:flex; align-items:center; justify-content:space-between;
    font-size:14.5px; font-weight:600; color:var(--text-primary); text-align:left;
  }
  .data-row:last-child{border-bottom:none;}
  .data-row .chev{color:var(--text-muted); font-size:18px;}

  .settings-event-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-subtle);}
  .settings-event-row:last-child{border-bottom:none;}
  .settings-event-row .info .name{font-size:14px; font-weight:700;}
  .settings-event-row .info .date{font-size:12px; color:var(--text-secondary); margin-top:2px;}
  .settings-event-row .info .obs{font-size:11.5px; color:var(--text-muted); margin-top:2px; font-style:italic;}
  .obs{font-size:12.5px; color:var(--text-secondary); font-style:italic; line-height:1.4;}
  .row-actions{display:flex; gap:8px; flex-shrink:0;}
  .icon-btn{background:var(--bg-elevated); border:1px solid var(--border-subtle); border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary);}
  .icon-btn.danger-btn{color:var(--status-danger);}
  .tag-pill{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:2px 7px; border-radius:20px; margin-left:8px; vertical-align:middle;}
  .tag-pill.attn{background:var(--accent-dim); color:var(--accent);}
  .tag-pill.mile{background:var(--bg-elevated); color:var(--text-muted); border:1px solid var(--border-subtle);}

  .add-btn{width:100%; background:var(--accent-dim); color:var(--accent); border:1px dashed var(--accent); border-radius:10px; padding:12px; font-size:14px; font-weight:700; margin-top:14px;}
  .shape-select{display:flex; gap:8px; margin-bottom:16px;}
  .shape-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; border-radius:10px; border:1px solid var(--border-subtle); background:var(--bg-elevated); color:var(--text-secondary);}
  .shape-btn.active{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}
  .shape-btn-label{font-size:11px; font-weight:700; text-align:center;}
  .suggest-btn{width:100%; background:var(--bg-elevated); color:var(--accent); border:1px solid var(--accent); border-radius:10px; padding:11px; font-size:13px; font-weight:700; margin-bottom:14px; text-align:left;}
  .suggest-btn .suggest-sub{display:block; font-weight:500; color:var(--text-secondary); font-size:11px; margin-top:2px;}
  .bed-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-subtle);}
  .bed-row:last-child{border-bottom:none;}
  .bed-row .bed-remove{color:var(--status-danger); font-size:13px; font-weight:700; padding:4px 8px; background:none; border:none;}
  .calc-total{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--bg-elevated); border-radius:10px; margin:12px 0; font-size:14px; font-weight:700;}
  .calc-result{background:var(--accent-dim); border:1px solid var(--accent); border-radius:12px; padding:14px; margin-top:16px;}
  .calc-result-row{display:flex; justify-content:space-between; font-size:14px; padding:4px 0; color:var(--text-secondary);}
  .calc-result-row.total{font-weight:800; font-size:16px; color:var(--text-primary); border-top:1px solid var(--border-subtle); margin-top:6px; padding-top:10px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--bg-surface); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto; border:1px solid var(--border-subtle); border-bottom:none;}
  .modal h2{margin:0 0 16px; font-size:17px; font-weight:800;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; border-radius:10px; padding:13px; font-size:15px; font-weight:700; border:none;}
  .btn-primary{background:var(--accent); color:#0d1512;}
  .btn-secondary{background:var(--bg-elevated); color:var(--text-secondary); border:1px solid var(--border-subtle);}
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1512;">
    <svg viewBox="0 0 380 200" width="220" height="116">
      <circle cx="100" cy="100" r="35" fill="none" stroke="#b28eb6" stroke-width="2.5"/>
      <g fill="none" stroke="#b28eb6" stroke-width="2.5">
        <circle cx="100" cy="100" r="45"/>
        <circle cx="100" cy="100" r="55"/>
        <circle cx="100" cy="100" r="65"/>
        <circle cx="100" cy="100" r="75"/>
        <circle cx="100" cy="100" r="85"/>
      </g>
      <circle cx="170" cy="100" r="32" fill="#0d1512"/>
      <text x="150" y="113" font-family="Poppins" font-weight="500" font-size="34" fill="#b28eb6" letter-spacing="6">FARM</text>
    </svg>
  </div>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script>
const e = React.createElement;
const useState = React.useState;
const useEffect = React.useEffect;
const useMemo = React.useMemo;

const STORAGE_KEY = "japhe_farm_v1";

// kind: "milestone" = one-time crop-stage marker (Season timeline).
// kind: "attention" = recurring action worth checking regularly.
const CATEGORIES = [
  { id: "nursery",       label: "Nursery preparation",       kind: "milestone" },
  { id: "sowing",        label: "Sowing",                     kind: "milestone" },
  { id: "emergence",     label: "Seedlings emerged",          kind: "milestone" },
  { id: "land_prep",     label: "Land preparation",           kind: "milestone" },
  { id: "transplanting", label: "Transplanting",              kind: "milestone" },
  { id: "fertilizer",    label: "Fertilizer application",     kind: "attention" },
  { id: "spray",         label: "Spraying (pest/disease)",    kind: "attention" },
  { id: "weeding",       label: "Weeding",                     kind: "attention" },
  { id: "mulch",         label: "Mulching / removing mulch",  kind: "attention" },
  { id: "irrigation",    label: "Irrigation / watering",      kind: "attention" },
  { id: "harvest",       label: "Harvest",                     kind: "milestone" },
  { id: "stored_sold",   label: "Stored / Sold",               kind: "milestone" },
  { id: "custom",        label: "Custom",                      kind: "attention" }
];

const DISPOSITION_OPTIONS = ["Stored", "Sold"];

// Priority order for "Needs your attention" — most important first. The section fills with
// whichever of these already have data, skipping any not logged yet instead of showing a blank slot.

function daysSince(dateStr){
  if(!dateStr) return 0;
  const start = new Date(dateStr + "T00:00:00");
  if(isNaN(start.getTime())) return 0;
  const now = new Date();
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((nowMid - startMid) / 86400000);
}
// Pure date-diff between two logged dates (positive when b is after a) — used by Guardrails,
// which check the relationship between two of the farmer's own logged dates, not "now."
function daysBetween(dateA, dateB){
  if(!dateA || !dateB) return null;
  const a = new Date(dateA + "T00:00:00"), b = new Date(dateB + "T00:00:00");
  if(isNaN(a.getTime()) || isNaN(b.getTime())) return null;
  return Math.round((b - a) / 86400000);
}
function formatDateDisplay(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-GB", { day:"2-digit", month:"long", year:"numeric" });
}
// Area Calculator — shape math. Acute triangle takes all 3 side lengths (easiest to measure in
// the field with a tape/rope) and uses Heron's formula rather than requiring an angle.
const BED_SHAPES = [
  { id:"rectangle", label:"Rectangle" },
  { id:"trapezoid", label:"Trapezoid" },
  { id:"right_triangle", label:"Right triangle" },
  { id:"acute_triangle", label:"Acute triangle" }
];
function shapeIconSvg(shapeId){
  const common = { viewBox:"0 0 24 24", width:"28", height:"28", fill:"none", stroke:"currentColor", strokeWidth:"2", strokeLinejoin:"round", strokeLinecap:"round" };
  if(shapeId === "rectangle") return e("svg", common, e("rect", { x:"3", y:"6", width:"18", height:"12" }));
  if(shapeId === "trapezoid") return e("svg", common, e("path", { d:"M5,6 L19,6 L21,18 L3,18 Z" }));
  if(shapeId === "right_triangle") return e("svg", common, e("path", { d:"M4,20 L4,4 L20,20 Z" }));
  if(shapeId === "acute_triangle") return e("svg", common, e("path", { d:"M12,3 L21,19 L3,17 Z" }));
  return null;
}
function computeShapeArea(shape, dims){
  if(shape === "rectangle"){
    const l = Number(dims.length), w = Number(dims.width);
    if(!(l > 0) || !(w > 0)) return null;
    return l * w;
  }
  if(shape === "trapezoid"){
    const l = Number(dims.length), w1 = Number(dims.width1), w2 = Number(dims.width2);
    if(!(l > 0) || !(w1 > 0) || !(w2 > 0)) return null;
    return ((w1 + w2) / 2) * l;
  }
  if(shape === "right_triangle"){
    const b = Number(dims.base), h = Number(dims.height);
    if(!(b > 0) || !(h > 0)) return null;
    return 0.5 * b * h;
  }
  if(shape === "acute_triangle"){
    const a = Number(dims.sideA), b = Number(dims.sideB), c = Number(dims.sideC);
    if(!(a > 0) || !(b > 0) || !(c > 0)) return null;
    // Triangle inequality check — three sides that can't form a real triangle.
    if(a + b <= c || a + c <= b || b + c <= a) return null;
    const s = (a + b + c) / 2;
    const inner = s * (s - a) * (s - b) * (s - c);
    if(inner <= 0) return null;
    return Math.sqrt(inner);
  }
  return null;
}
function shapeLabel(shape){ const m = BED_SHAPES.find(function(s){ return s.id === shape; }); return m ? m.label : shape; }
function plantsPerM2(rowCm, plantCm){ if(!(rowCm > 0) || !(plantCm > 0)) return null; return 10000 / (rowCm * plantCm); }
function bedDimsSummary(shape, dims){
  if(shape === "rectangle") return dims.length + "m × " + dims.width + "m";
  if(shape === "trapezoid") return "length " + dims.length + "m, widths " + dims.width1 + "/" + dims.width2 + "m";
  if(shape === "right_triangle") return "base " + dims.base + "m, height " + dims.height + "m";
  if(shape === "acute_triangle") return "sides " + dims.sideA + "/" + dims.sideB + "/" + dims.sideC + "m";
  return "";
}

function urgencyClass(days){ if(days >= 30) return "danger"; if(days >= 14) return "warn"; return "ok"; }
function urgencyColorVar(days){ if(days >= 30) return "var(--status-danger)"; if(days >= 14) return "var(--status-warning)"; return "var(--status-success)"; }
function ordinalLabel(n){ if(n===1) return "1st"; if(n===2) return "2nd"; if(n===3) return "3rd"; return n+"th"; }
function relativeLabel(days){
  if(days === 0) return "Today";
  if(days === 1) return "Yesterday";
  if(days < 0) return "Upcoming";
  return days + " days ago";
}

function withOrdinals(events){
  const byCat = {};
  const sorted = events.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  const ordinalById = {};
  sorted.forEach(function(ev){
    byCat[ev.categoryId] = (byCat[ev.categoryId] || 0) + 1;
    ordinalById[ev.id] = byCat[ev.categoryId];
  });
  return events.map(function(ev){ return Object.assign({}, ev, { _ordinal: ordinalById[ev.id] }); });
}

// A transplanting event may span several days rather than happening in one day (see
// transplantAnchorDate below for why this matters to the engine). When it does, ev.date is the
// start and ev.endDate is the completion date; this renders that as a range instead of implying
// a single-day event.
function transplantSpanDays(ev){
  if(!ev || ev.categoryId !== "transplanting" || !ev.endDate || ev.endDate <= ev.date) return null;
  const gap = daysBetween(ev.date, ev.endDate);
  return gap == null ? null : gap + 1;
}
// The date the engine treats as "transplanting happened" for age (DAT) calculations. Per the
// simple-mode design decision, that's the completion date when transplanting spanned multiple
// days (never an averaged date — see transplantDatRange for why averaging is avoided), and the
// single logged date otherwise.
function transplantAnchorDate(ev){
  if(!ev) return null;
  return (ev.categoryId === "transplanting" && ev.endDate && ev.endDate > ev.date) ? ev.endDate : ev.date;
}
// For a multi-day transplanting event, the true crop age varies by how early or late a given
// section was planted. Rather than collapsing that into one averaged age (which mistimes
// fertilizer/irrigation/pest guidance for every section except the middle one), this exposes the
// real earliest/latest/average DAT so a screen can show the range instead of a false single number.
function transplantDatRange(ev){
  const span = transplantSpanDays(ev);
  if(!span) return null;
  // The earliest-transplanted section (start date) is the OLDEST and so has the highest DAT;
  // the last-transplanted section (end date) is the YOUNGEST and has the lowest DAT.
  const oldestSectionDAT = daysSince(ev.date);
  const youngestSectionDAT = daysSince(ev.endDate);
  return {
    spanDays: span,
    minDAT: youngestSectionDAT, maxDAT: oldestSectionDAT,
    averageDAT: Math.round((oldestSectionDAT + youngestSectionDAT) / 2)
  };
}
function eventDisplayName(ev){
  const cat = categoryMeta(ev.categoryId);
  if(ev.categoryId === "transplanting" && transplantSpanDays(ev)){
    return "Transplanting completed over " + transplantSpanDays(ev) + " days (" + formatDateDisplay(ev.date) + "\u2013" + formatDateDisplay(ev.endDate) + ")";
  }
  if(ev.categoryId === "spray") return "Spraying (" + (ev.sprayType || "Insecticide") + ")";
  if(ev.categoryId === "fertilizer" && ev.fertilizerType) return "Fertilizer application (" + ev.fertilizerType + (ev.quantityKg ? ", " + ev.quantityKg + "kg" : "") + ")";
  if(ev.categoryId === "stored_sold"){
    const outcome = ev.outcome || "Stored";
    let text = outcome;
    if(ev.quantityGunia) text += " (" + ev.quantityGunia + " gunia)";
    if(outcome === "Sold" && ev.priceTsh) text += ", Tsh " + Number(ev.priceTsh).toLocaleString();
    return text;
  }
  if(ev.label) return ev.label;
  return cat.label;
}

// Imperative phrasing for the Next Action cards: "what to do", not "what was logged".
const ACTION_VERB = {
  fertilizer: "Apply fertilizer",

// Short, sourced explanation shown on the Why screen for each routine action, grounded in the
// onion knowledge database rather than a generic guess. Kept deliberately brief; the timing is
// advisory context, not a rule the app enforces on its own.
// Some categories mean genuinely different things in the nursery vs after transplanting (this
// is exactly the bug flagged: fertilizer guidance was showing the 30/45-day post-transplant
// schedule even while still in the nursery, which made no sense before transplanting had
// happened). Where that's true, the entry has separate germination/growing variants; where the
// guidance is the same either way (spray, mulch, custom), it stays a single flat entry.
const ACTION_GUIDANCE = {
  fertilizer: {
    germination: { text: "In the nursery, fertilizer is normally a single basal application worked into the bed when you prepare it, for example around 20g DAP per square metre, or well-rotted manure, not a repeating routine through the nursery weeks. The 30/45-day split top-dress schedule only starts once the seedlings are transplanted. Once seedlings have actually sprouted, DAP, Urea, and CAN should not be applied near them at all, they can burn or dehydrate young roots. Compost, manure, or a dilute liquid feed after true leaves appear are the safe options at that point.", sourceKeys: ["KE1", "MCN1", "FCN1"] },
    growing: { text: "Typically split into two applications, around 30 and 45 days after transplanting, then stopped at least 4 weeks before harvest. Too much, too late, tends to cause thick necks and poor storage.", sourceKeys: ["G1", "KE1", "G7"] }
  },
  spray: { text: "Best done on a regular watch and respond basis rather than a fixed schedule. Weekly scouting for thrips (the dominant regional pest) is more reliable than a calendar date, in the nursery as much as after transplanting.", sourceKeys: ["TZ2", "UG2", "G7"] },
  weeding: {
    germination: { text: "Keep the nursery bed weeded by hand right through the nursery weeks, tiny seedlings are especially vulnerable to competition while this small and shallow-rooted.", sourceKeys: ["NG1", "G7"] },
    growing: { text: "Onions compete poorly with weeds due to their shallow, upright growth habit. Staying on top of this matters more early in the season, before the canopy fills in.", sourceKeys: ["G3", "G7"] }
  },
  irrigation: {
    germination: { text: "Light and frequent, avoid waterlogging, this is when damping-off risk is highest for young seedlings.", sourceKeys: ["G1", "KE1"] },
    growing: { text: "Light and frequent early on, substantially more at bulbing (the highest-demand stage), reduced and then stopped 2-4 weeks before harvest.", sourceKeys: ["G1", "G7", "G8", "G9"] }
  },
  mulch: { text: "Helps conserve moisture and suppress weeds early on, but is best removed once bulbing starts so it doesn't interfere with bulb enlargement.", sourceKeys: ["G7"] },
  custom: { text: "No specific guideline for a custom activity. This is whatever you've defined it to be.", sourceKeys: [] }
};
// Resolves a possibly phase-split ACTION_GUIDANCE entry down to a single {text, sourceKeys}
// for the current phase. Falls back sensibly if a phase-specific variant isn't defined.
function guidanceFor(catId, heroPhase){
  const g = ACTION_GUIDANCE[catId];
  if(!g) return { text:"", sourceKeys:[] };
  if(g.germination || g.growing){
    if(heroPhase === "germination" && g.germination) return g.germination;
    return g.growing || g.germination;
  }
  return g;
}
function nextActionTitle(ev){
  if(ev.categoryId === "fertilizer"){
    const detail = ev.fertilizerType ? (" (" + ev.fertilizerType + (ev.quantityKg ? ", " + ev.quantityKg + "kg" : "") + ")") : "";
    return "Apply fertilizer" + detail;
  }
  if(ev.categoryId === "spray") return "Spray (" + (ev.sprayType || "Insecticide") + ")";
  return ACTION_VERB[ev.categoryId] || eventDisplayName(ev);
}

function RingGauge(props){
  const days = props.days, size = props.size || 52, stroke = props.stroke || 5, neutral = props.neutral;
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, days / 30));
  const color = neutral ? "var(--accent-sage)" : urgencyColorVar(days);
  const numClass = neutral ? "neutral" : urgencyClass(days);
  return e("div", { className:"ring-wrap", style:{ width:size, height:size } },
    e("svg", { width:size, height:size },
      e("circle", { cx:size/2, cy:size/2, r:r, fill:"none", stroke:"var(--bg-elevated)", strokeWidth:stroke }),
      e("circle", { cx:size/2, cy:size/2, r:r, fill:"none", stroke:color, strokeWidth:stroke, strokeDasharray:c, strokeDashoffset:c*(1-pct), strokeLinecap:"round" })
    ),
    e("div", { className:"ring-num mono " + numClass }, days < 0 ? "—" : days)
  );
}

function TopAttentionCard(props){
  const ev = props.ev;
  const days = daysSince(ev.date);
  return e("div", { className:"event-card", key: ev.id },
    e(RingGauge, { days: days }),
    e("div", { className:"ev-mid" },
      e("div", { className:"ev-name" }, nextActionTitle(ev)),
      e("div", { className:"ev-sub" }, ordinalLabel(ev._ordinal) + " time · last done " + relativeLabel(days)),
      ev.observation ? e("div", { className:"ev-obs" }, "“" + ev.observation + "”") : null
    )
  );
}

function TimelineItem(ev){
  const days = daysSince(ev.date);
  return e("div", { className:"tl-item", key: ev.id },
    e("div", { className:"tl-line" }), e("div", { className:"tl-dot" }),
    e("div", { className:"tl-name" }, eventDisplayName(ev)),
    e("div", { className:"tl-date" }, relativeLabel(days))
  );
}

// Growth-stage labels, split by which season phase is currently anchoring the day-count.
// Phase 1 (sowing → transplanting): a single constant label — no point sub-staging by days
// here since the real trigger for moving on is the Transplanting event, not a day threshold.
const GERMINATION_LABEL = "Germination & establishment";
const COMPLETE_LABEL = "Season complete";
// Phase 2 (transplanting → harvest): day thresholds are defaults (TARI-based typical onion
// timings) and are meant to be checked against logged Observations over time, not treated as fact.
const POST_TRANSPLANT_STAGES = [
  { max: 25, label: "Vegetative growth" },
  { max: 55, label: "Bulb development" },
  { max: 85, label: "Maturation" },
  { max: 110, label: "Ready for harvest check" },
  { max: Infinity, label: "Late, check if harvest was missed" }
];
function stageForTransplantDays(days){
  for(var i = 0; i < POST_TRANSPLANT_STAGES.length; i++){ if(days <= POST_TRANSPLANT_STAGES[i].max) return POST_TRANSPLANT_STAGES[i].label; }
  return POST_TRANSPLANT_STAGES[POST_TRANSPLANT_STAGES.length-1].label;
}
// Phase 3 (harvest → stored/sold): one constant label, ends when Stored/Sold is logged.
const DRYING_LABEL = "Curing / drying";

// Picks the one check relevant to the current phase/sub-stage, evaluates it against the most
// recent Observation, and returns everything the "Why" screen needs to explain itself. Never
// changes the logged-event phase — advisory only, per design decision.
function evaluateBaselineCheck(heroPhase, subStageLabel, observations, seasonAnchorDate){
  let checkKey = null;
  Object.keys(BASELINE_CHECKS).forEach(function(key){
    const c = BASELINE_CHECKS[key];
    if(c.appliesWhenPhase !== heroPhase) return;
    if(c.onlySubStage){
      const allowed = Array.isArray(c.onlySubStage) ? c.onlySubStage : [c.onlySubStage];
      if(allowed.indexOf(subStageLabel) === -1) return;
    }
    checkKey = key;
  });
  if(!checkKey) return null;
  const check = BASELINE_CHECKS[checkKey];

  // Only consider observations logged this season — otherwise a leftover observation from a
  // previous (or pre-season) cycle can be picked up as "the latest" and used to justify advice
  // about the current season.
  const inSeason = function(o){ return !seasonAnchorDate || o.date >= seasonAnchorDate; };
  const seasonObservations = (observations || []).filter(inSeason);
  const latest = seasonObservations.slice().sort(function(a,b){ return b.date.localeCompare(a.date); })[0] || null;

  const results = check.criteria.map(function(c){
    const outcome = latest ? c.test(latest) : null; // true=match, false=not yet, null=not recorded
    const observedValue = latest ? c.getValue(latest) : null;
    return { fieldLabel: c.fieldLabel, expectedText: c.expectedText, outcome: outcome, observedValue: observedValue };
  });
  const provided = results.filter(function(r){ return r.outcome !== null; });
  let overall;
  if(!latest || provided.length === 0) overall = "no-data";
  else if(provided.length === results.length && provided.every(function(r){ return r.outcome === true; })) overall = "full";
  else if(provided.some(function(r){ return r.outcome === true; })) overall = "partial";
  else overall = "none";

  return {
    checkKey: checkKey, label: check.label, actionHint: check.actionHint,
    sourceKeys: check.sourceKeys, sourceNote: check.sourceNote,
    results: results, overall: overall,
    observationDate: latest ? latest.date : null
  };
}

// ---- One-time phase actions ----
// Some recommendations aren't "do this repeatedly, more urgent the longer you wait" (that's
// what FULL_PRIORITY / ACTION_GUIDANCE are for) — they're "do this exactly once, triggered by
// a real event you log, and once done never show it again as an action, only in History."
// Nursery mulch removal is the first case: it's paced by the farmer's own logged emergence
// date (never a fixed calendar day, onions germinate anywhere from ~7 to 14+ days), and once
// removed it's permanently finished for the season.
const ONE_TIME_ACTIONS = {
  removeNurseryMulch: {
    appliesWhenPhase: "germination",
    triggerCategory: "emergence",
    doneCategory: "mulch",
    label: "Remove nursery mulch",
    guidance: "Remove the mulch or cover as soon as seedlings actually sprout, not on a fixed day count. Multiple regional sources agree on this trigger regardless of how long germination itself took.",
    avoid: "Don't leave it on once seedlings have emerged; it blocks light and can weaken or scorch the shoots. Don't remove it before germination either, uncovered soil exposes the seed bed to birds, drying out, and temperature swings before the seedlings are actually up.",
    sourceKeys: ["KE2", "UG3"]
  }
};

// Evaluates one specific one-time action against the farmer's own logged events (never a
// calendar assumption). Returns null if it doesn't apply to the current phase at all.
function evaluateOneTimeAction(actionKey, heroPhase, events, seasonAnchorDate){
  const action = ONE_TIME_ACTIONS[actionKey];
  if(!action || action.appliesWhenPhase !== heroPhase) return null;
  const inSeason = function(ev){ return !seasonAnchorDate || ev.date >= seasonAnchorDate; };
  const triggers = events.filter(function(ev){ return ev.categoryId === action.triggerCategory && inSeason(ev); });
  if(triggers.length === 0) return { key: actionKey, action: action, status: "not-yet-triggered", triggerEvent: null, doneEvent: null };
  const triggerEvent = triggers.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).pop();
  // Use the season anchor (not the exact trigger date) as the cutoff: the real question is
  // "did this done-action happen this season?", not "did it happen after this specific trigger
  // log entry?". Otherwise a done-event logged slightly before the trigger event (e.g. mulch
  // removed the day before emergence was logged), or before a later duplicate trigger event
  // (e.g. a second emergence log), is wrongly rejected.
  const doneSince = seasonAnchorDate || triggerEvent.date;
  const doneMatches = events.filter(function(ev){ return ev.categoryId === action.doneCategory && ev.date >= doneSince; });
  const doneEvent = doneMatches.length ? doneMatches.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).pop() : null;
  return { key: actionKey, action: action, status: doneEvent ? "done" : "due", triggerEvent: triggerEvent, doneEvent: doneEvent };
}

// ---- Sunlight / shade actions ----
// A second kind of one-time action, triggered by a logged Observation field (sunlightEffect)
// rather than a milestone event, since sun scorch and shade progress are things a farmer
// notices and records, not a discrete dated action. Only relevant after mulch has actually
// been removed. Shade timing is deliberately vague on exact source day-counts (the sources
// found don't give an onion-specific number) — this is flagged honestly in the guidance text
// rather than presented as more precise than it is.
const SUNLIGHT_ACTIONS = {
  erectShade: {
    appliesWhenPhase: "germination",
    label: "Erect a raised shade over the nursery bed",
    guidance: "Once seedlings show sun scorch after mulch removal, regional practice is to put up a raised shade rather than re-covering the bed with mulch directly. A general vegetable-nursery guide suggests roughly 1m above the bed, high enough for air to move underneath, not resting on the seedlings.",
    avoid: "Don't lay mulch back directly on the seedlings, that blocks light again and undoes the point of removing it. Don't build the shade too low either, it needs airflow underneath.",
    sourceKeys: ["MIA1", "DLP1"]
  },
  removeShadeGradually: {
    appliesWhenPhase: "germination",
    label: "Start removing the shade gradually",
    guidance: "General nursery guidance is to reduce shade gradually over about 10 days rather than pulling it all at once, no onion-specific day count was found in the sources checked, so treat 10 days as a starting point, not a fixed rule. Based on what you've seen on your own farm, aim to have it fully off well before 3 weeks.",
    avoid: "Don't leave the shade up for weeks, seedlings that stay shaded too long stretch and grow thin and leggy reaching for light, then get shocked once the shade finally comes off, which matches what you observed in a previous season.",
    sourceKeys: ["WAC1"]
  }
};

function evaluateSunlightAction(actionKey, heroPhase, observations, seasonAnchorDate){
  const action = SUNLIGHT_ACTIONS[actionKey];
  if(!action || action.appliesWhenPhase !== heroPhase) return null;
  const inSeason = function(o){ return !seasonAnchorDate || o.date >= seasonAnchorDate; };
  const withField = (observations || []).filter(function(o){ return o.sunlightEffect && inSeason(o); }).sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(withField.length === 0) return null;
  const latest = withField[withField.length - 1];
  if(actionKey === "erectShade"){
    if(latest.sunlightEffect !== "Mild scorch seen") return null;
    return { key: actionKey, action: action, status: "due", triggerEvent: latest };
  }
  if(actionKey === "removeShadeGradually"){
    // Track this as a small state machine over the whole season's observations, not just the
    // single latest one: find the most recent "Shade erected" reading, then check whether
    // anything at or beyond "Shade partially removed" was logged after it. This still flags the
    // advisory even if the farmer's very next logged observation jumps straight to "fully
    // removed" — previously that skip made the engine forget "erected" ever happened, and also
    // correctly resolves the advisory once it happens, rather than leaving it stuck forever.
    const erectedEvents = withField.filter(function(o){ return o.sunlightEffect === "Shade erected"; });
    if(erectedEvents.length === 0) return null;
    const lastErected = erectedEvents[erectedEvents.length - 1];
    const resolvedAfter = withField.some(function(o){ return o.date > lastErected.date && obsSunlightIndex(o.sunlightEffect) >= obsSunlightIndex("Shade partially removed"); });
    if(resolvedAfter) return null;
    return { key: actionKey, action: action, status: "due", triggerEvent: lastErected };
  }
  return null;
}

// ---- Threat Map (pest/disease diagnosis) ----
// "I see X on my leaves -> it's likely Y." Structured-field only, same discipline as the rest
// of the engine: no free-text parsing. The widened-vocabulary idea is handled here by grouping
// equivalent phrasings under one concept (SYMPTOM_GROUPS) rather than fuzzy-matching many raw
// values — a new equivalent dropdown option can be added to a group later without touching any
// match function. Every rule here was checked against the actual FiBL Africa manual (G7) text,
// not just plausible-sounding agronomy: Stemphylium was dropped entirely (no real source found
// for it in G7 or any African-region source checked), Botrytis was split into the two genuinely
// distinct diseases the source describes (a foliar Leaf Blight vs. the storage-stage Neck Rot,
// which the source states is "often only visible on removal from storage" — not a mid-season
// field symptom), and Downy mildew's match was rewritten to the source's actual described
// symptoms instead of an invented field.
const SYMPTOM_GROUPS = {
  silveryLeafDamage: ["Silvery-white patches or streaks"],
  purpleLesions: ["Purple lesions with yellow/orange border"],
  leafBlightSpots: ["Grey-white oval spots with a silvery halo"],
  downyMildewGrowth: ["Purple-grey velvety growth, leaf tips dying back"],
  softNeck: ["Soft or rotting neck"]
};
function symptomIn(value, groupKey){ return (SYMPTOM_GROUPS[groupKey] || []).indexOf(value) !== -1; }
function weatherIsHumid(note){ return note === "Humid" || note === "Heavy rain recently"; }

const THREAT_RULES = [
  {
    id: "thrips",
    label: "Thrips (Thrips tabaci)",
    severity: "high",
    stages: ["Vegetative growth", "Bulb development", "Maturation", "Ready for harvest check", "Late, check if harvest was missed"],
    match: function(o){ return o.pestPresence === "Thrips" || symptomIn(o.diseaseSymptoms, "silveryLeafDamage"); },
    message: "Thrips are the dominant regional pest, causing up to 60% yield loss when severe. Scout weekly and consider neem oil or an approved insecticide.",
    avoid: "Don't wait for heavy infestation before acting; thrips damage also opens plants to secondary infections.",
    sourceKeys: ["TZ2", "UG2", "G9", "G7"]
  },
  {
    id: "purple_blotch",
    label: "Purple blotch (Alternaria porri)",
    severity: "high",
    stages: ["Vegetative growth", "Bulb development", "Maturation"],
    match: function(o){ return symptomIn(o.diseaseSymptoms, "purpleLesions"); },
    message: "Purple blotch develops over a wide temperature range but spreads fastest in humid conditions. Improve airflow between plants and avoid overhead irrigation.",
    avoid: "Don't leave infected crop residue in the field afterward, it's a source of ongoing infection. No direct organic treatment is well established once symptoms appear, so prevention (spacing, drainage, rotation) matters most.",
    sourceKeys: ["UG2", "G7"]
  },
  {
    id: "leaf_blight",
    label: "Leaf blight (Botrytis squamosa)",
    severity: "medium",
    stages: ["Vegetative growth", "Bulb development", "Maturation"],
    match: function(o){ return symptomIn(o.diseaseSymptoms, "leafBlightSpots"); },
    message: "A foliar disease favoured by warm conditions (16-28\u00b0C). Remove infected onion remains and volunteer plants, and avoid overwatering the leaves.",
    avoid: "Don't over-apply nitrogen, it encourages the lush growth this disease favours.",
    sourceKeys: ["G7"]
  },
  {
    id: "downy_mildew",
    label: "Downy mildew (Peronospora species)",
    severity: "high",
    stages: ["Vegetative growth", "Bulb development"],
    match: function(o){ return symptomIn(o.diseaseSymptoms, "downyMildewGrowth") && weatherIsHumid(o.weatherNote); },
    message: "Favoured by cool, very humid nights with wet leaves in the morning. Improve ventilation and avoid overhead irrigation, especially in the evening.",
    avoid: "No effective organic fungicide is established for this once it appears, prevention matters far more than a cure here.",
    sourceKeys: ["G7"]
  },
  {
    id: "neck_rot",
    label: "Neck rot (Botrytis species)",
    severity: "critical",
    stages: ["Maturation", "Ready for harvest check", "Late, check if harvest was missed", "Curing / drying"],
    match: function(o){ return symptomIn(o.diseaseSymptoms, "softNeck"); },
    message: "This is primarily a storage disease, damage is often only visible after weeks in storage, not necessarily right now. Harvest only once necks have fallen over naturally, avoid harvesting in the rain, and dry bulbs thoroughly and quickly.",
    avoid: "Don't store any bulb showing a soft neck alongside healthy ones, sort it out first.",
    sourceKeys: ["G7"]
  }
];

// Evaluates every threat rule against the most recent in-season observation. Only runs during
// the growing/drying phases, since these are field/harvest-stage diseases, not nursery ones.
function evaluateThreatMap(heroPhase, heroStageLabel, observations, seasonAnchorDate){
  if(heroPhase !== "growing" && heroPhase !== "drying") return [];
  const inSeason = function(o){ return !seasonAnchorDate || o.date >= seasonAnchorDate; };
  const seasonObs = (observations || []).filter(inSeason).sort(function(a,b){ return a.date.localeCompare(b.date); });
  const latest = seasonObs[seasonObs.length - 1];
  if(!latest) return [];
  return THREAT_RULES.filter(function(rule){
    return rule.stages.indexOf(heroStageLabel) !== -1 && rule.match(latest);
  }).map(function(rule){
    return { id: rule.id, label: rule.label, severity: rule.severity, message: rule.message, avoid: rule.avoid, sourceKeys: rule.sourceKeys, observationDate: latest.date };
  });
}

// ---- Guardrails ----
// "You just did X at a time that contradicts the sourced guidance -> a note for next time."
// This is retrospective, educational feedback about an event that already happened, not an
// action still needed — so it's shown on Why as awareness, not as a Home advisory card
// demanding action. Checked against the farmer's own logged dates relative to other logged
// milestones (transplant, harvest), never a free-floating calendar assumption.
const GUARDRAILS = [
  {
    id: "fertilizer_too_late",
    label: "Fertilizer applied later than the recommended window",
    categoryId: "fertilizer",
    severity: "medium",
    check: function(ev, ctx){
      if(!ctx.transplantEvent) return false;
      const dpt = daysBetween(transplantAnchorDate(ctx.transplantEvent), ev.date);
      if(dpt == null || dpt < 0) return false;
      if(ctx.harvestEvent){
        const daysBeforeHarvest = daysBetween(ev.date, ctx.harvestEvent.date);
        if(daysBeforeHarvest != null && daysBeforeHarvest < 28) return true;
      }
      return dpt > 55;
    },
    message: "Guidance is to split fertilizer around 30 and 45 days after transplanting, then stop at least 4 weeks before harvest. This application looks later than that window.",
    avoid: "Late, heavy nitrogen tends to cause thick necks and poor storage rather than more yield at this point in the season.",
    sourceKeys: ["G1", "KE1", "G7"]
  },
  {
    id: "irrigation_too_close_to_harvest",
    label: "Irrigation logged close to harvest",
    categoryId: "irrigation",
    severity: "low",
    check: function(ev, ctx){
      if(!ctx.harvestEvent) return false;
      const daysBeforeHarvest = daysBetween(ev.date, ctx.harvestEvent.date);
      return daysBeforeHarvest != null && daysBeforeHarvest >= 0 && daysBeforeHarvest < 14;
    },
    message: "Guidance is to reduce and stop irrigation 2-4 weeks before harvest. This watering was logged less than 2 weeks before the harvest date.",
    avoid: "Watering too close to harvest can affect curing and storage quality.",
    sourceKeys: ["G1", "G7", "G8", "G9"]
  }
];

function evaluateGuardrails(events, seasonAnchorDate, transplantEvent, harvestEvent){
  const inSeason = function(ev){ return !seasonAnchorDate || ev.date >= seasonAnchorDate; };
  const ctx = { transplantEvent: transplantEvent, harvestEvent: harvestEvent };
  const flags = [];
  GUARDRAILS.forEach(function(rule){
    events.filter(function(ev){ return ev.categoryId === rule.categoryId && inSeason(ev); }).forEach(function(ev){
      if(rule.check(ev, ctx)){
        flags.push({ id: rule.id, label: rule.label, severity: rule.severity, message: rule.message, avoid: rule.avoid, sourceKeys: rule.sourceKeys, eventDate: ev.date });
      }
    });
  });
  return flags;
}

// ---- Fertilizer Safety ----
// Crop-agnostic on purpose: this is basic fertilizer chemistry (ammonia toxicity to
// germinating seeds/young roots, and calcium-phosphate lock-up when incompatible products are
// mixed), not an onion-specific fact. The same rules apply whatever gets planted in this
// nursery bed next. Verified against real sources before shipping — the DAP-ammonia mechanism
// against the exact source the user provided (MCN1), the relative toxicity ranking (urea more
// dangerous than DAP, DAP more dangerous than MAP/compost) against Field Crop News (FCN1), and
// the calcium+phosphate lock-up chemistry against Purdue's Vegetable Crops Hotline (PU1).
const FERTILIZER_RISK_PROFILE = {
  "DAP": { riskyNearSeedlings: true, containsCalcium: false, containsPhosphate: true },
  "Urea": { riskyNearSeedlings: true, containsCalcium: false, containsPhosphate: false },
  "CAN": { riskyNearSeedlings: true, containsCalcium: true, containsPhosphate: false },
  "Calcium Nitrate": { riskyNearSeedlings: true, containsCalcium: true, containsPhosphate: false },
  "NPK compound": { riskyNearSeedlings: true, containsCalcium: false, containsPhosphate: true },
  "Compost / manure": { riskyNearSeedlings: false, containsCalcium: false, containsPhosphate: false },
  "Other": { riskyNearSeedlings: false, containsCalcium: false, containsPhosphate: false }
};
function fertilizersIncompatible(typeA, typeB){
  const a = FERTILIZER_RISK_PROFILE[typeA], b = FERTILIZER_RISK_PROFILE[typeB];
  if(!a || !b) return false;
  // Phosphate + calcium is the classic lock-up: they form insoluble calcium phosphate.
  return (a.containsPhosphate && b.containsCalcium) || (a.containsCalcium && b.containsPhosphate);
}

function evaluateFertilizerSafety(events, seasonAnchorDate, sowingEvent){
  const inSeason = function(ev){ return !seasonAnchorDate || ev.date >= seasonAnchorDate; };
  const fertEvents = events.filter(function(ev){ return ev.categoryId === "fertilizer" && ev.fertilizerType && inSeason(ev); })
    .sort(function(a,b){ return a.date.localeCompare(b.date); });
  const flags = [];

  fertEvents.forEach(function(ev){
    const profile = FERTILIZER_RISK_PROFILE[ev.fertilizerType];
    // A risky product logged after the sowing day itself (not same-day bed prep) means it was
    // most likely applied at or near already-germinating seedlings, not mixed into the bed
    // before anything was planted.
    if(profile && profile.riskyNearSeedlings && sowingEvent && ev.date > sowingEvent.date){
      flags.push({
        id: "fertilizer_unsafe_near_seedlings",
        label: ev.fertilizerType + " applied near young seedlings",
        severity: "critical",
        message: ev.fertilizerType + " releases ammonia and/or a strong salt effect close to seeds and roots, which can dehydrate or burn young seedlings. Compost, well-rotted manure, or a dilute liquid feed after true leaves appear are the safe nursery options.",
        avoid: "Don't apply " + ev.fertilizerType + " directly to a nursery bed or close to seedling roots. If used at all, it belongs mixed into the soil well before sowing, several cm away from where the seed goes.",
        sourceKeys: ["MCN1", "FCN1"],
        eventDate: ev.date
      });
    }
  });

  for(var i = 1; i < fertEvents.length; i++){
    const prev = fertEvents[i-1], curr = fertEvents[i];
    const gapDays = daysBetween(prev.date, curr.date);
    if(gapDays != null && gapDays <= 7 && fertilizersIncompatible(prev.fertilizerType, curr.fertilizerType)){
      flags.push({
        id: "fertilizer_incompatible_pair",
        label: prev.fertilizerType + " and " + curr.fertilizerType + " applied close together",
        severity: "high",
        message: "Phosphate-based fertilizers (like DAP or NPK compounds) and calcium-based fertilizers (like CAN or calcium nitrate) react together to form calcium phosphate, which is insoluble and useless to the plant.",
        avoid: "Space these out, or pick one or the other for a given application rather than combining them.",
        sourceKeys: ["PU1"],
        eventDate: curr.date
      });
    }
  }
  return flags;
}

function healthStatus(latestByCat){
  const cats = FULL_PRIORITY.filter(function(id){ return !!latestByCat[id]; });
  if(cats.length === 0) return { label: "Not enough data yet", cls: "neutral" };
  let worst = "ok";
  cats.forEach(function(id){
    const uc = urgencyClass(daysSince(latestByCat[id].date));
    if(uc === "danger") worst = "danger";
    else if(uc === "warn" && worst !== "danger") worst = "warn";
  });
  if(worst === "danger") return { label: "Needs attention", cls: "danger" };
  if(worst === "warn") return { label: "Keep an eye", cls: "warn" };
  return { label: "On track", cls: "ok" };
}

function computeNextAction(latestByCat){
  const cats = FULL_PRIORITY.filter(function(id){ return !!latestByCat[id]; });
  if(cats.length === 0) return null;
  let best = null;
  cats.forEach(function(id){
    const ev = latestByCat[id];
    const uc = urgencyClass(daysSince(ev.date));
    const score = uc === "danger" ? 2 : uc === "warn" ? 1 : 0;
    if(!best || score > best.score){ best = { catId:id, ev:ev, score:score }; }
  });
  return best;
}

function observationSummaryText(o){
  if(o.notes && o.notes.trim()) return o.notes.trim();
  const parts = [];
  if(o.observedStage) parts.push(o.observedStage);
  if(o.leafCount != null && o.leafCount !== "") parts.push(o.leafCount + " leaves");
  if(o.heightCm != null && o.heightCm !== "") parts.push(o.heightCm + "cm");
  if(o.soilMoisture) parts.push("Soil: " + o.soilMoisture);
  if(o.leafColor) parts.push("Leaf: " + o.leafColor);
  if(o.pestPresence && o.pestPresence !== "None seen") parts.push("Pest: " + o.pestPresence);
  if(o.diseaseSymptoms && o.diseaseSymptoms !== "None seen") parts.push("Disease: " + o.diseaseSymptoms);
  return parts.length ? parts.join(" · ") : "Field check logged";
}

// Merges the quick observation notes on fertilizer/spray events with the dedicated
// Observation log, and returns whichever is most recent, in one shared shape.
function latestFieldNote(state){
  const items = [];
  state.events.forEach(function(ev){
    if(ev.observation && ev.observation.trim()){
      items.push({ date: ev.date, text: ev.observation.trim(), source: eventDisplayName(ev) });
    }
  });
  (state.observations || []).forEach(function(o){
    items.push({ date: o.date, text: observationSummaryText(o), source: "Field observation" });
  });
  if(items.length === 0) return null;
  return items.sort(function(a,b){ return b.date.localeCompare(a.date); })[0];
}

// Shared by HomeScreen and WhyScreen so both always agree on the current season phase.
function computeSeasonPhase(events){
  function latestOf(catId, sinceDate){
    const matches = events.filter(function(ev){ return ev.categoryId === catId && (!sinceDate || ev.date >= sinceDate); });
    if(matches.length === 0) return null;
    return matches.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).pop();
  }
  const sowingEvent = latestOf("sowing", null);
  // Season anchor is normally the most recent Sowing. If a farmer bought seedlings and never
  // logged a Sowing/nursery step at all, fall back to Transplanting so the season can still
  // start (and correctly skips straight to the Growing phase, never a phantom nursery phase).
  const seasonAnchor = sowingEvent || latestOf("transplanting", null);
  function latestInSeason(catId){
    if(!seasonAnchor) return null;
    return latestOf(catId, seasonAnchor.date);
  }
  const transplantEvent = latestInSeason("transplanting");
  const harvestEvent = latestInSeason("harvest");
  const dispositionEvent = latestInSeason("stored_sold");

  // Walk the milestone sequence (sowing -> transplant -> harvest -> disposition) and only
  // advance the phase when the next milestone's date is at or after the one before it. This
  // stops two things: a leftover disposition/harvest from an earlier season sealing a new
  // season shut just because it shares the same (old) sowing anchor (a new Transplanting
  // logged after the old season's Stored/Sold should reopen the season as "growing", not stay
  // "complete"), and a backdated/out-of-order harvest producing an impossible phase.
  let heroPhase = null;
  let phaseAnchorDate = null;
  if(seasonAnchor){
    heroPhase = sowingEvent ? "germination" : "growing";
    phaseAnchorDate = seasonAnchor.date;
    if(transplantEvent && transplantAnchorDate(transplantEvent) >= phaseAnchorDate){
      heroPhase = "growing";
      phaseAnchorDate = transplantAnchorDate(transplantEvent);
    }
    if(harvestEvent && harvestEvent.date >= phaseAnchorDate){
      heroPhase = "drying";
      phaseAnchorDate = harvestEvent.date;
    }
    if(dispositionEvent && dispositionEvent.date >= phaseAnchorDate){
      heroPhase = "complete";
      phaseAnchorDate = dispositionEvent.date;
    }
  }
  const heroAnchorEvent = heroPhase === "growing" ? transplantEvent
    : heroPhase === "drying" ? harvestEvent
    : heroPhase === "complete" ? dispositionEvent
    : (heroPhase === "germination" ? sowingEvent : null);
  const cropAge = heroAnchorEvent ? daysSince(heroPhase === "growing" ? transplantAnchorDate(heroAnchorEvent) : heroAnchorEvent.date) : null;
  const heroStageLabel = heroPhase === "growing" ? stageForTransplantDays(cropAge)
    : heroPhase === "drying" ? DRYING_LABEL
    : heroPhase === "complete" ? COMPLETE_LABEL
    : GERMINATION_LABEL;
  // Only meaningful in the growing phase, and only non-null when transplanting actually spanned
  // multiple days — lets a screen show "12-18 DAT" instead of a single (potentially misleading) age.
  const transplantDatRangeInfo = heroPhase === "growing" ? transplantDatRange(transplantEvent) : null;
  return { sowingEvent: sowingEvent, transplantEvent: transplantEvent, harvestEvent: harvestEvent, dispositionEvent: dispositionEvent,
    heroPhase: heroPhase, cropAge: cropAge, heroStageLabel: heroStageLabel, heroAnchorEvent: heroAnchorEvent,
    transplantDatRange: transplantDatRangeInfo };
}

    transplantDatRange = seasonPhase.transplantDatRange;

  const latestByCat = useMemo(function(){

            e("div", { className:"empty-state", style:{ margin:"0 20px 20px" } },
